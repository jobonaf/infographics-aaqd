# Stringhe italiane. Liste = righe già spezzate. Separatore decimale: virgola.
# I numeri tra graffe ({LV}, {beta}, {rel}, {p90}) sono calcolati in build.py.
lang: it
alt_title: "MQI e MQO: la qualità dei modelli nella valutazione"
alt_desc: >-
  Infografica in quattro pannelli. 1: l'indicatore MQI, rapporto tra l'errore quadratico medio di modello e misure e
  l'incertezza ammessa di misura e modello, calcolato in ogni stazione. 2: l'incertezza ammessa per il PM10 (media annua)
  in funzione della concentrazione, per le misure fisse e per il modello (misure fisse moltiplicate per il rapporto β).
  3: il target plot FAIRMODE dell'MQO a breve termine: ogni stazione è un punto (CRMSE e bias normalizzati) e la distanza
  dal centro è l'MQI; l'MQO è soddisfatto quando almeno il 90 % dei punti è nel cerchio di raggio 1, con un esempio
  sintetico di dodici stazioni. 4: con data fusion o assimilazione, la validazione su dati indipendenti
  con la procedura leave-one-out.
