lang: it
alt_title: 'MQI e MQO: la qualità dei modelli nella valutazione'
alt_desc: Infografica sul target plot FAIRMODE e sull'obiettivo di qualità della modellistica. Ogni stazione è rappresentata mediante CRMSE e bias normalizzati; la distanza dal centro è l'MQI. L'esempio sintetico mostra un MQI90 pari a {p90}. Sono inoltre illustrati il calcolo dell'MQI, l'andamento dell'incertezza ammessa e la necessità di validare la fusione dei dati con osservazioni indipendenti.
title: 'MQI e MQO: la qualità dei modelli nella valutazione'
subtitle: Dir. (UE) 2024/2881, Allegato V · Documento tecnico di supporto della Commissione (aprile 2025), §3.4
