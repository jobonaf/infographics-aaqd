lang: en
alt_title: 'MQI and MQO: model quality in air quality assessment'
alt_desc: Infographic about the FAIRMODE target plot and the modelling quality objective. Each station is represented by normalised CRMSE and bias; its distance from the centre is the MQI. The synthetic example has an MQI90 of {p90}. The infographic also illustrates the MQI calculation, the allowed-uncertainty curve and the need to validate data fusion using independent observations.
title: 'MQI and MQO: model quality in air quality assessment'
