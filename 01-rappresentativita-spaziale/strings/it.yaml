lang: it
alt_title: "Rappresentatività spaziale di un punto di campionamento"
alt_desc: >-
  Infografica in tre pannelli. 1: il valore centrale C in un punto di campionamento (media annua, misurata o modellata).
  2: la tolleranza, max(15 % di C; minimo di Allegato I), con due esempi numerici per il PM10.
  3: l’area di rappresentatività su una mappa di zona sintetica, raffinata escludendo le celle vicine a una strada molto
  trafficata e quelle con profilo di sorgente diverso.
