# English strings. Lists = pre-broken lines. Decimal separator: dot.
# Numbers in braces ({LV}, {beta}, {rel}, {p90}) are computed in build.py.
lang: en
alt_title: "MQI and MQO: model quality in air quality assessment"
alt_desc: >-
  Infographic in four panels. 1: the MQI indicator, the ratio between the root mean square error of model versus
  measurements and the maximum allowed uncertainty of measurement and model, computed at each station. 2: the allowed
  uncertainty for PM10 (annual mean) as a function of concentration, for fixed measurements and for the model (fixed
  measurement uncertainty times the ratio β). 3: the FAIRMODE target plot of the short-term MQO: each station is a point (normalised CRMSE and bias) and the distance
  from the centre is the MQI; the MQO is fulfilled when at least 90 % of the points fall inside the circle of radius 1,
  with a synthetic example of twelve stations. 4: with data fusion or
  assimilation, validation on independent data through the leave-one-out procedure.
