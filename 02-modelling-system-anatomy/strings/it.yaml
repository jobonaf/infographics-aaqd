# Stringhe italiane - slide 02: anatomia di un sistema modellistico (archetipo H, anatomia con callout + matrioska)
lang: it
alt_title: "Anatomia di un sistema modellistico"
alt_desc: >-
  Schema a blocchi: tre ingressi (emissioni, meteorologia, condizioni al contorno o di fondo) entrano nel modello, che può essere
  deterministico (fisica e chimica dell'atmosfera) oppure data-driven (relazioni empiriche, machine learning), e produce le
  concentrazioni. Le misure rientrano in due modi: con l'assimilazione, che le integra durante il calcolo del modello, e con la
  data fusion, che corregge i risultati a posteriori. In alto a destra, riquadri annidati (matrioska) per le scale: globale o
  regionale da 50 a 1 km, urbana da 3 km a 100 m, locale da 100 a 10 m, microscala nell'ordine dei metri; nessun modello copre tutte le scale,
  quindi più modelli si collegano in una catena e ciascuno fornisce le condizioni al contorno al successivo. Sotto, la dimensione massima delle celle: 100 m per NO2 vicino alle strade, 10 km per PM2,5 di fondo regionale.
