# English strings - slide 02: anatomy of a modelling system (archetype H, anatomy with callouts + nested scales)
lang: en
alt_title: "Anatomy of a modelling system"
alt_desc: >-
  Block diagram: three inputs (emissions, meteorology, boundary conditions or background) feed the model, which can be
  deterministic (physics and chemistry of the atmosphere) or data-driven (empirical relationships, machine learning), and
  produces concentrations. Measurements come back in two ways: assimilation blends them in while the model runs, and data
  fusion corrects the results afterwards. Top right, nested boxes (Russian doll) show the scales: global or regional 50 to
  1 km, urban 3 km to 100 m, local 100 to 10 m, micro scale in metres; no single model covers all scales, so several models are linked in a chain, each providing boundary conditions to the next. Below, the
  maximum cell size: 100 m for NO2 near roads, 10 km for regional-background PM2.5.
