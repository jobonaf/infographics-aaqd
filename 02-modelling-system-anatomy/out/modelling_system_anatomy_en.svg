<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" lang="en" font-family="'Source Sans 3','Source Sans Pro','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Anatomy of a modelling system</title>
<desc id="d">Block diagram: three inputs (emissions, meteorology, boundary conditions or background) feed the model, which can be deterministic (physics and chemistry of the atmosphere) or data-driven (empirical relationships, machine learning), and produces concentrations. Measurements come back in two ways: assimilation blends them in while the model runs, and data fusion corrects the results afterwards. Top right, nested boxes (Russian doll) show the scales: global or regional 50 to 1 km, urban 3 km to 100 m, local 100 to 10 m, micro scale in metres; no single model covers all scales, so several models are linked in a chain, each providing boundary conditions to the next. Below, the maximum cell size: 100 m for NO2 near roads, 10 km for regional-background PM2.5.</desc>
<rect width="1920" height="1080" fill="#EFEBDD"/>
<text x="48" y="76" font-size="58" fill="#1F5F63" font-weight="700">Anatomy of a modelling system</text><text x="48" y="122" font-size="30" fill="#22343A">Modelling system and scales · Commission technical support document (April 2025), §1.4 · Directive (EU) 2024/2881</text>
