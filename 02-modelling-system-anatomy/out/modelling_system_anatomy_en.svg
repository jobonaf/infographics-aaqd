<rect x="36" y="910" width="1848" height="120" rx="28" fill="#1F5F63"/>
<text x="76" y="965" font-size="30" fill="#fff"><tspan font-weight="700">The model is the core of a modelling system,</tspan> which also includes the input data and works at a given scale.</text>
<text x="76" y="1007" font-size="30" fill="#fff">No single model covers all scales: several models are linked in a chain.</text>
</svg>
