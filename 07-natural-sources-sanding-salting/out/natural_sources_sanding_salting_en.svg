<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" lang="en" font-family="'Source Sans 3','Source Sans Pro','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Natural sources, road salt and sand: when an exceedance can be subtracted</title>
<desc id="d">Decision tree. It starts from the question on the cause of the exceedance. If the cause is natural (wildfires, sea spray, dust from arid regions, eruptions), the contribution is subtracted if needed to meet the limit, provided it is determined with sufficient certainty. If the cause is winter salt or sand on roads (PM10 only), it is subtracted if reasonable measures were taken to lower concentrations; otherwise it stays in the exceedance. Any other cause stays in the exceedance. A box explains that in projections salt and sand emissions stay at the reference-year level, if known, unless the plan reduces them; modelling of salt and sand is not recommended.</desc>
<rect id="background" width="1920" height="1080" fill="#EFEBDD"/>
<text x="48" y="76" font-size="58" fill="#1F5F63" font-weight="700">Natural sources, road salt and sand</text><text x="48" y="122" font-size="30" fill="#22343A">What can be subtracted · Commission technical support document (April 2025), §3.7 and §5.3.4 · Dir. (EU) 2024/2881</text>
