<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" lang="it" font-family="'Source Sans 3','Source Sans Pro','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Sorgenti naturali, sale e sabbia: quando un superamento si può sottrarre</title>
<desc id="d">Albero decisionale. Si parte dalla domanda sulla causa del superamento. Se la causa è naturale (incendi boschivi, spruzzi marini, polvere da regioni aride, eruzioni), il contributo si sottrae se serve a rispettare il limite, purché sia determinato con sufficiente certezza. Se la causa è sale o sabbia sulle strade (solo PM10), si sottrae se sono state prese misure ragionevoli per ridurre le concentrazioni; altrimenti resta nel superamento. Ogni altra causa resta nel superamento. Un riquadro spiega che nelle proiezioni le emissioni di sale e sabbia restano quelle dell’anno di riferimento, se note, salvo riduzioni previste dal piano; la modellistica di sale e sabbia non è raccomandata.</desc>
<rect id="background" width="1920" height="1080" fill="#EFEBDD"/>
<text x="48" y="76" font-size="58" fill="#1F5F63" font-weight="700">Sorgenti naturali, sale e sabbia</text><text x="48" y="122" font-size="30" fill="#22343A">Che cosa si può sottrarre · Documento tecnico di supporto della Commissione (aprile 2025), §3.7 e §5.3.4 · Dir. (UE) 2024/2881</text>
