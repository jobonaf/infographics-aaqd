# Stringhe italiane: albero decisionale su sorgenti naturali, sale e sabbia.
lang: it
alt_title: "Sorgenti naturali, sale e sabbia: quando un superamento si può sottrarre"
alt_desc: >-
  Albero decisionale. Si parte dalla domanda sulla causa del superamento. Se la causa è naturale (incendi boschivi, spruzzi
  marini, polvere da regioni aride, eruzioni), il contributo si sottrae se serve a rispettare il limite, purché sia determinato
  con sufficiente certezza. Se la causa è sale o sabbia sulle strade (solo PM10), si sottrae se sono state prese misure
  ragionevoli per ridurre le concentrazioni; altrimenti resta nel superamento. Ogni altra causa resta nel superamento. Un
  riquadro spiega che nelle proiezioni le emissioni di sale e sabbia restano quelle dell’anno di riferimento, se note, salvo
  riduzioni previste dal piano; la modellistica di sale e sabbia non è raccomandata.
