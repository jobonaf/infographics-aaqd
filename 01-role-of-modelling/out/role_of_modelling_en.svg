<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" lang="en" font-family="'Source Sans 3','Source Sans Pro','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">The role of modelling in the air quality directive: five domains, one pathway</title>
<desc id="d">Hub diagram: modelling at the centre, five domains around it, each with one question. Network (where to place the stations), assessment (how far the exceedance extends), source apportionment (who causes it, i.e. which sources the pollution comes from), plans (which measures are enough) and forecasts (will the threshold be exceeded tomorrow). Assessment, source apportionment and plans form the pathway of an exceedance, numbered 1 to 3; source apportionment strengthens the assessment models and the emission inventories; the plans carry the final check. The network is defined beforehand; forecasts trigger short-term action plans.</desc>
<rect width="1920" height="1080" fill="#EFEBDD"/>
<text x="48" y="76" font-size="58" fill="#1F5F63" font-weight="700">The role of modelling in the ambient air quality directive (AAQD)</text><text x="48" y="122" font-size="30" fill="#22343A">Five domains, one pathway · Commission technical support document (April 2025), §1.3 · Directive (EU) 2024/2881</text>
