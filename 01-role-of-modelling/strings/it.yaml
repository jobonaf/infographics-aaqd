lang: it
alt_title: "Il ruolo della modellistica nella direttiva sull’aria: cinque ambiti, un percorso"
alt_desc: >-
  Schema a hub: al centro la modellistica, intorno cinque ambiti con una domanda ciascuno. Rete (dove mettere le stazioni),
  valutazione (quanto è esteso il superamento), source apportionment (chi lo causa, cioè da quali sorgenti viene
  l'inquinamento), piani (quali misure bastano) e previsioni (domani si supera la soglia). Valutazione, source apportionment
  e piani formano il percorso di un superamento, numerato da 1 a 3; il source apportionment rafforza i modelli di valutazione
  e gli inventari delle emissioni; sui piani c'è la verifica finale. La rete si definisce prima; le previsioni innescano i
  piani a breve termine.
title: "Il ruolo della modellistica nella direttiva sull’aria (AAQD)"
