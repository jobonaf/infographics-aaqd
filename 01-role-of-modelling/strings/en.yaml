# English strings. Lists = pre-broken lines.
lang: en
alt_title: "The role of modelling in the air quality directive: five domains, one pathway"
alt_desc: >-
  Hub diagram: modelling at the centre, five domains around it, each with one question. Network (where to place the
  stations), assessment (how far the exceedance extends), source apportionment (who causes it, i.e. which sources the
  pollution comes from), plans (which measures are enough) and forecasts (will the threshold be exceeded tomorrow).
  Assessment, source apportionment and plans form the pathway of an exceedance, numbered 1 to 3; source apportionment
  strengthens the assessment models and the emission inventories; the plans carry the final check. The network is defined
  beforehand; forecasts trigger short-term action plans.
title: "The role of modelling in the ambient air quality directive (AAQD)"
