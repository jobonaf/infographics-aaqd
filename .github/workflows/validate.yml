name: Validate infographics

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy PyYAML cffconvert

      - name: Validate repository and build SVG files
        run: python scripts/validate_repository.py

      - name: Upload generated SVG files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-svg
          path: "*/out/*.svg"
          if-no-files-found: warn
          retention-days: 14

      - name: Validate citation metadata
        run: cffconvert --validate
