lang: en
alt_title: "Spatial representativeness of a sampling point"
alt_desc: >-
  Three-panel infographic. 1: the central value C at a sampling point (annual mean, measured or modelled).
  2: the tolerance, max(15 % of C; Annex I minimum), with two worked examples for PM10.
  3: the representativeness area on a synthetic zone map, refined by excluding cells near a heavily trafficked road
  and cells with a different source profile.
