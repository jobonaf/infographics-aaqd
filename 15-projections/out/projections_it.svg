<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" lang="it" font-family="'Source Sans 3','Source Sans Pro','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Proiezioni: come stimare le concentrazioni future</title>
<desc id="d">Infografica in tre pannelli su come si stimano le concentrazioni in un anno futuro per un piano di qualità dell&#x27;aria, con le cinque incertezze da controllare. 1: emissioni future, fondo (con dati europei già pronti) e come trattare sorgenti naturali, sale e sabbia sulle strade. 2: le quattro scelte possibili per la meteorologia e il caso dell&#x27;esposizione media. 3: la correzione del bias del modello con un esempio inventato (differenza assoluta, relativa, combinata), la prova della correzione sul passato e la verifica della sensibilità dinamica del modello.</desc>
<rect id="background" width="1920" height="1080" fill="#EFEBDD"/>
<text x="48" y="86" font-size="58" fill="#1F5F63" font-weight="700">Proiezioni: come stimare le concentrazioni future</text>
<text x="48" y="134" font-size="30" fill="#22343A">Documento tecnico di supporto della Commissione (aprile 2025), §5.3 e §5.4 · Dir. (UE) 2024/2881, Allegato VIII</text>
<g id="panel1"><rect x="36" y="170" width="430" height="710" rx="30" fill="#fff" stroke="#1F5F63" stroke-opacity=".35" stroke-width="2"/><circle cx="76" cy="218" r="24.0" fill="#1F5F63"/><text x="76" y="228.0" font-size="28" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="116.0" y="230.0" font-size="36" fill="#1F5F63" font-weight="700">Emissioni e fondo</text><text x="60" y="270" font-size="22" fill="#22343A" font-weight="700">La proiezione riguarda l’intera zona.</text><text x="60" y="314" font-size="25" fill="#1F5F63" font-weight="700">Emissioni future</text><text x="60" y="344" font-size="21" fill="#22343A"><tspan x="60" dy="0">Dipendono da misure e trend delle attività:</tspan><tspan x="60" dy="25.2">sono incerte, per questo si calcolano un caso</tspan><tspan x="60" dy="25.2">migliore e uno peggiore.</tspan></text><text x="60" y="428" font-size="25" fill="#1F5F63" font-weight="700">Fondo (background)</text><text x="60" y="458" font-size="21" fill="#22343A"><tspan x="60" dy="0">Concentrazione che arriva da fuori dell’area</tspan><tspan x="60" dy="25.2">modellata e cambia con le politiche europee e</tspan><tspan x="60" dy="25.2">nazionali. Dati pronti: emissioni per paese</tspan><tspan x="60" dy="25.2">2025–2050 (IIASA, istituto internazionale di</tspan><tspan x="60" dy="25.2">analisi dei sistemi applicati) e scenari</tspan><tspan x="60" dy="25.2">europei (CAMS, servizio Copernicus per</tspan><tspan x="60" dy="25.2">l’atmosfera).</tspan></text><text x="60" y="642" font-size="25" fill="#1F5F63" font-weight="700">Sorgenti naturali, sale e sabbia</text><text x="60" y="672" font-size="21" fill="#22343A"><tspan x="60" dy="0">Le sorgenti naturali (es. incendi boschivi)</tspan><tspan x="60" dy="25.2">si sottraggono dai superamenti se serve per</tspan><tspan x="60" dy="25.2">rispettare il limite; così anche sale e</tspan><tspan x="60" dy="25.2">sabbia sulle strade (PM10), se si mostrano</tspan><tspan x="60" dy="25.2">misure ragionevoli. Nelle proiezioni le loro</tspan><tspan x="60" dy="25.2">emissioni restano quelle dell’anno di</tspan><tspan x="60" dy="25.2">riferimento, salvo riduzioni previste dal</tspan><tspan x="60" dy="25.2">piano.</tspan></text></g>
<path d="M474.0,516 h10 v-9 l16,18 l-16,18 v-9 h-10 z" fill="#1F5F63"/>
<g id="panel2"><rect x="506" y="170" width="520" height="710" rx="30" fill="#fff" stroke="#1F5F63" stroke-opacity=".35" stroke-width="2"/><circle cx="546" cy="218" r="24.0" fill="#1F5F63"/><text x="546" y="228.0" font-size="28" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="586.0" y="230.0" font-size="36" fill="#1F5F63" font-weight="700">Meteorologia</text><text x="530" y="268" font-size="21" fill="#22343A" font-weight="700">Il meteo futuro non si prevede: si sceglie.</text><circle cx="549" cy="319" r="19" fill="#1F5F63"/><text x="549" y="327" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="580" y="326" font-size="24" fill="#1F5F63" font-weight="700">Anno di riferimento</text><rect x="776.4" y="305" width="101.2" height="29" rx="14.5" fill="#1F5F63"/><text x="787.4" y="325" font-size="18" fill="#fff" font-weight="700">consigliata</text><text x="580" y="352" font-size="21" fill="#22343A"><tspan x="580" dy="0">Meteo dell’anno del superamento per tutti gli</tspan><tspan x="580" dy="24.8">scenari: confronto diretto, meno calcoli e</tspan><tspan x="580" dy="24.8">correzione del bias legata alla valutazione. Va</tspan><tspan x="580" dy="24.8">verificato che sia un anno rappresentativo.</tspan></text><circle cx="549" cy="456" r="19" fill="#1F5F63"/><text x="549" y="464" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="580" y="463" font-size="24" fill="#1F5F63" font-weight="700">Ultimi 3–5 anni</text><rect x="738.0" y="442" width="108.4" height="29" rx="14.5" fill="#fff" stroke="#A9A59B" stroke-width="2.2"/><text x="749.0" y="462" font-size="18" fill="#22343A">più completa</text><text x="580" y="489" font-size="21" fill="#22343A"><tspan x="580" dy="0">Media, anno migliore e anno peggiore: stima più</tspan><tspan x="580" dy="24.8">robusta, perché le misure devono valere in tutti</tspan><tspan x="580" dy="24.8">gli anni, ma servono più calcoli.</tspan></text><circle cx="549" cy="568" r="19" fill="#1F5F63"/><text x="549" y="576" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="580" y="575" font-size="24" fill="#1F5F63" font-weight="700">Un anno rappresentativo</text><text x="580" y="601" font-size="21" fill="#22343A"><tspan x="580" dy="0">Un solo anno recente, scelto anche con i dati di</tspan><tspan x="580" dy="24.8">misura: si perde il legame con l’anno di</tspan><tspan x="580" dy="24.8">riferimento.</tspan></text><circle cx="549" cy="680" r="19" fill="#1F5F63"/><text x="549" y="688" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="580" y="687" font-size="24" fill="#1F5F63" font-weight="700">Dati meteo statistici</text><text x="580" y="713" font-size="21" fill="#22343A"><tspan x="580" dy="0">Per modelli su aree piccole: dati statistici che</tspan><tspan x="580" dy="24.8">rappresentano un anno migliore e uno peggiore.</tspan></text><path d="M530,750 H1002" stroke="#A9A59B" stroke-width="2"/><text x="530" y="780" font-size="24" fill="#1F5F63" font-weight="700">Esposizione media (AEI)</text><text x="530" y="810" font-size="21" fill="#22343A"><tspan x="530" dy="0">Stessa meteorologia nell’anno di proiezione (es. 2030) e</tspan><tspan x="530" dy="24.8">10 anni prima (es. 2020), su 3 anni consecutivi. Conta</tspan><tspan x="530" dy="24.8">soprattutto la variazione relativa.</tspan></text></g>
<path d="M1034.0,516 h10 v-9 l16,18 l-16,18 v-9 h-10 z" fill="#1F5F63"/>
<g id="panel3"><rect x="1066" y="170" width="778" height="710" rx="30" fill="#fff" stroke="#1F5F63" stroke-opacity=".35" stroke-width="2"/><circle cx="1106" cy="218" r="24.0" fill="#1F5F63"/><text x="1106" y="228.0" font-size="28" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="1146.0" y="230.0" font-size="36" fill="#1F5F63" font-weight="700">Correzione del bias e verifiche</text><text x="1090" y="268" font-size="21" fill="#22343A"><tspan x="1090" dy="0">Il modello di solito sottostima o sovrastima rispetto alle misure (bias). La</tspan><tspan x="1090" dy="24.8">correzione dipende dalla causa: fondo o fonti ignote, oppure fonti modellate.</tspan></text><text x="1090" y="321" font-size="19" fill="#22343A" font-style="italic">esempio inventato (µg/m³): il modello sottostima di 5</text><path d="M1270.0,337 V545" stroke="#A9A59B" stroke-opacity=".5" stroke-width="1.6"/><text x="1270.0" y="569" font-size="19" fill="#22343A" text-anchor="middle">0</text><path d="M1312.5,337 V545" stroke="#A9A59B" stroke-opacity=".5" stroke-width="1.6"/><text x="1312.5" y="569" font-size="19" fill="#22343A" text-anchor="middle">5</text><path d="M1355.0,337 V545" stroke="#A9A59B" stroke-opacity=".5" stroke-width="1.6"/><text x="1355.0" y="569" font-size="19" fill="#22343A" text-anchor="middle">10</text><path d="M1397.5,337 V545" stroke="#A9A59B" stroke-opacity=".5" stroke-width="1.6"/><text x="1397.5" y="569" font-size="19" fill="#22343A" text-anchor="middle">15</text><path d="M1440.0,337 V545" stroke="#A9A59B" stroke-opacity=".5" stroke-width="1.6"/><text x="1440.0" y="569" font-size="19" fill="#22343A" text-anchor="middle">20</text><text x="1090" y="364.0" font-size="18" fill="#22343A">Valutazione: modello</text><rect x="1270.0" y="344.0" width="68.0" height="28" fill="#B4BFC3"/><rect x="1338.0" y="344.0" width="59.5" height="28" fill="#2A9D9A"/><text x="1405.5" y="365.0" font-size="19" fill="#22343A" font-weight="700">15,0</text><text x="1090" y="398.0" font-size="18" fill="#22343A">Valutazione: misure</text><rect x="1270.0" y="378.0" width="170.0" height="28" fill="#22343A"/><text x="1448.0" y="399.0" font-size="19" fill="#22343A" font-weight="700">20,0</text><text x="1090" y="432.0" font-size="18" fill="#22343A">Proiezione: nessuna</text><rect x="1270.0" y="412.0" width="61.2" height="28" fill="#B4BFC3"/><rect x="1331.2" y="412.0" width="35.7" height="28" fill="#2A9D9A"/><text x="1374.9" y="433.0" font-size="19" fill="#22343A" font-weight="700">11,4</text><text x="1090" y="466.0" font-size="18" fill="#22343A">Proiezione: assoluta</text><rect x="1270.0" y="446.0" width="61.2" height="28" fill="#B4BFC3"/><rect x="1331.2" y="446.0" width="35.7" height="28" fill="#2A9D9A"/><rect x="1366.9" y="446.0" width="42.5" height="28" fill="#C58B1A"/><text x="1417.4" y="467.0" font-size="19" fill="#22343A" font-weight="700">16,4</text><text x="1090" y="500.0" font-size="18" fill="#22343A">Proiezione: relativa</text><rect x="1270.0" y="480.0" width="61.2" height="28" fill="#B4BFC3"/><rect x="1331.2" y="480.0" width="35.7" height="28" fill="#2A9D9A"/><rect x="1366.9" y="480.0" width="32.3" height="28" fill="#C58B1A"/><text x="1407.2" y="501.0" font-size="19" fill="#22343A" font-weight="700">15,2</text><text x="1090" y="534.0" font-size="18" fill="#22343A">Proiezione: combinata</text><rect x="1270.0" y="514.0" width="61.2" height="28" fill="#B4BFC3"/><rect x="1331.2" y="514.0" width="25.5" height="28" fill="#C58B1A"/><rect x="1356.7" y="514.0" width="35.7" height="28" fill="#2A9D9A"/><rect x="1392.4" y="514.0" width="10.2" height="28" fill="#C58B1A"/><text x="1410.6" y="535.0" font-size="19" fill="#22343A" font-weight="700">15,6</text><rect x="1090.0" y="587" width="20" height="18" rx="3" fill="#B4BFC3"/><text x="1118" y="601" font-size="19" fill="#22343A">fondo</text><rect x="1182.0" y="587" width="20" height="18" rx="3" fill="#2A9D9A"/><text x="1210.0" y="601" font-size="19" fill="#22343A">fonte locale</text><rect x="1327.2" y="587" width="20" height="18" rx="3" fill="#C58B1A"/><text x="1355.2" y="601" font-size="19" fill="#22343A">correzione</text><text x="1504" y="361" font-size="23" fill="#1F5F63" font-weight="700">Assoluta (+5 µg/m³)</text><text x="1504" y="389" font-size="21" fill="#22343A"><tspan x="1504" dy="0">Si aggiunge la differenza: per un</tspan><tspan x="1504" dy="24.8">fondo sbagliato o fonti ignote.</tspan></text><text x="1504" y="448" font-size="23" fill="#1F5F63" font-weight="700">Relativa (×1,33)</text><text x="1504" y="476" font-size="21" fill="#22343A"><tspan x="1504" dy="0">Si moltiplica per lo stesso rapporto.</tspan><tspan x="1504" dy="24.8">Per fonti modellate che le misure</tspan><tspan x="1504" dy="24.8">riducono.</tspan></text><text x="1504" y="560" font-size="23" fill="#1F5F63" font-weight="700">Combinata</text><text x="1504" y="588" font-size="21" fill="#22343A"><tspan x="1504" dy="0">Relativa per le fonti, assoluta per</tspan><tspan x="1504" dy="24.8">il fondo.</tspan></text><path d="M1090,637 H1820" stroke="#A9A59B" stroke-width="2"/><text x="1090.0" y="669" font-size="24" fill="#1F5F63" font-weight="700">Provare la correzione sul passato</text><text x="1090.0" y="701" font-size="21" fill="#22343A"><tspan x="1090.0" dy="0">Si calcola la correzione per un anno</tspan><tspan x="1090.0" dy="24.8">passato (es. 2010) e la si applica a uno</tspan><tspan x="1090.0" dy="24.8">recente (es. 2020): il confronto con le</tspan><tspan x="1090.0" dy="24.8">misure dice se il metodo funziona.</tspan></text><text x="1473.0" y="669" font-size="24" fill="#1F5F63" font-weight="700">Sensibilità dinamica</text><text x="1473.0" y="701" font-size="21" fill="#22343A"><tspan x="1473.0" dy="0">Andare bene oggi non garantisce di</tspan><tspan x="1473.0" dy="24.8">rispondere bene alle riduzioni. Si</tspan><tspan x="1473.0" dy="24.8">verifica con i trend storici e con il</tspan><tspan x="1473.0" dy="24.8">modulo di DELTA (strumento FAIRMODE), che</tspan><tspan x="1473.0" dy="24.8">prova il modello di notte e di giorno,</tspan><tspan x="1473.0" dy="24.8">nei feriali e nei festivi.</tspan></text></g>
<g id="definition"><rect x="36" y="910" width="1848" height="120" rx="28" fill="#1F5F63"/><text x="74" y="960" font-size="27" fill="#fff"><tspan font-weight="700">Cinque incertezze:</tspan> emissioni future, fondo, meteorologia, correzione del bias, sensibilità dinamica: da controllare e, dove possibile, quantificare.</text><text x="74" y="1000" font-size="27" fill="#fff">Ogni scelta cambia il risultato: va dichiarata, con un intervallo di incertezza dove possibile.</text></g>
</svg>
