<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" lang="en" font-family="'Source Sans 3','Source Sans Pro','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Projections: how to estimate future concentrations</title>
<desc id="d">Infographic in three panels on how concentrations in a future year are estimated for an air quality plan, with the five uncertainties to control. 1: future emissions, background (with ready-made European data) and how to treat natural sources, road salt and sand. 2: the four possible choices for meteorology and the case of the average exposure indicator. 3: correcting the model bias with an invented example (absolute, relative, combined difference), testing the correction on the past and checking the model&#x27;s dynamic sensitivity.</desc>
<rect id="background" width="1920" height="1080" fill="#EFEBDD"/>
<text x="48" y="86" font-size="58" fill="#1F5F63" font-weight="700">Projections: how to estimate future concentrations</text>
<text x="48" y="134" font-size="30" fill="#22343A">Commission technical support document (April 2025), §5.3 and §5.4 · Dir. (EU) 2024/2881, Annex VIII</text>
<g id="panel1"><rect x="36" y="170" width="430" height="710" rx="30" fill="#fff" stroke="#1F5F63" stroke-opacity=".35" stroke-width="2"/><circle cx="76" cy="218" r="24.0" fill="#1F5F63"/><text x="76" y="228.0" font-size="28" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="116.0" y="230.0" font-size="36" fill="#1F5F63" font-weight="700">Emission inputs</text><text x="60" y="270" font-size="22" fill="#22343A" font-weight="700">The projection covers the whole zone.</text><text x="60" y="314" font-size="25" fill="#1F5F63" font-weight="700">Future emissions</text><text x="60" y="344" font-size="21" fill="#22343A"><tspan x="60" dy="0">They depend on measures and activity trends:</tspan><tspan x="60" dy="25.2">they are uncertain, so a best and a worst</tspan><tspan x="60" dy="25.2">case are calculated.</tspan></text><text x="60" y="428" font-size="25" fill="#1F5F63" font-weight="700">Background</text><text x="60" y="458" font-size="21" fill="#22343A"><tspan x="60" dy="0">The concentration arriving from outside the</tspan><tspan x="60" dy="25.2">modelled area; it changes with European and</tspan><tspan x="60" dy="25.2">national policies. Ready-made data: emissions</tspan><tspan x="60" dy="25.2">by country 2025–2050 (IIASA, the</tspan><tspan x="60" dy="25.2">international institute for applied systems</tspan><tspan x="60" dy="25.2">analysis) and European scenarios (CAMS, the</tspan><tspan x="60" dy="25.2">Copernicus atmosphere service).</tspan></text><text x="60" y="642" font-size="25" fill="#1F5F63" font-weight="700">Natural sources, salt and sand</text><text x="60" y="672" font-size="21" fill="#22343A"><tspan x="60" dy="0">Natural sources (e.g. wildfires) are</tspan><tspan x="60" dy="25.2">subtracted from exceedances if needed to meet</tspan><tspan x="60" dy="25.2">the limit; so are road salt and sand (PM10),</tspan><tspan x="60" dy="25.2">if reasonable measures are shown. In</tspan><tspan x="60" dy="25.2">projections their emissions stay at the</tspan><tspan x="60" dy="25.2">reference-year level, unless the plan reduces</tspan><tspan x="60" dy="25.2">them.</tspan></text></g>
<path d="M474.0,516 h10 v-9 l16,18 l-16,18 v-9 h-10 z" fill="#1F5F63"/>
<g id="panel2"><rect x="506" y="170" width="520" height="710" rx="30" fill="#fff" stroke="#1F5F63" stroke-opacity=".35" stroke-width="2"/><circle cx="546" cy="218" r="24.0" fill="#1F5F63"/><text x="546" y="228.0" font-size="28" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="586.0" y="230.0" font-size="36" fill="#1F5F63" font-weight="700">Meteorology</text><text x="530" y="268" font-size="21" fill="#22343A" font-weight="700">Future weather cannot be predicted: it is chosen.</text><circle cx="549" cy="319" r="19" fill="#1F5F63"/><text x="549" y="327" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="580" y="326" font-size="24" fill="#1F5F63" font-weight="700">Reference year</text><rect x="728.4" y="305" width="101.2" height="29" rx="14.5" fill="#1F5F63"/><text x="739.4" y="325" font-size="18" fill="#fff" font-weight="700">recommended</text><text x="580" y="352" font-size="21" fill="#22343A"><tspan x="580" dy="0">Weather of the exceedance year for all scenarios:</tspan><tspan x="580" dy="24.8">direct comparison, fewer runs and a bias</tspan><tspan x="580" dy="24.8">correction tied to the assessment. Check that it</tspan><tspan x="580" dy="24.8">is a representative year.</tspan></text><circle cx="549" cy="456" r="19" fill="#1F5F63"/><text x="549" y="464" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="580" y="463" font-size="24" fill="#1F5F63" font-weight="700">Last 3–5 years</text><rect x="728.4" y="442" width="115.6" height="29" rx="14.5" fill="#fff" stroke="#A9A59B" stroke-width="2.2"/><text x="739.4" y="462" font-size="18" fill="#22343A">most complete</text><text x="580" y="489" font-size="21" fill="#22343A"><tspan x="580" dy="0">Average, best and worst year: a more robust</tspan><tspan x="580" dy="24.8">estimate, because measures must work in every</tspan><tspan x="580" dy="24.8">year, but more runs are needed.</tspan></text><circle cx="549" cy="568" r="19" fill="#1F5F63"/><text x="549" y="576" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="580" y="575" font-size="24" fill="#1F5F63" font-weight="700">One representative year</text><text x="580" y="601" font-size="21" fill="#22343A"><tspan x="580" dy="0">A single recent year, also chosen with measurement</tspan><tspan x="580" dy="24.8">data: the link with the reference year is lost.</tspan></text><circle cx="549" cy="655" r="19" fill="#1F5F63"/><text x="549" y="663" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="580" y="662" font-size="24" fill="#1F5F63" font-weight="700">Statistical weather data</text><text x="580" y="688" font-size="21" fill="#22343A"><tspan x="580" dy="0">For models of small areas: statistical data</tspan><tspan x="580" dy="24.8">representing a better and a worse year.</tspan></text><path d="M530,725 H1002" stroke="#A9A59B" stroke-width="2"/><text x="530" y="755" font-size="24" fill="#1F5F63" font-weight="700">Average exposure (AEI)</text><text x="530" y="785" font-size="21" fill="#22343A"><tspan x="530" dy="0">Same meteorology in the projection year (e.g. 2030) and</tspan><tspan x="530" dy="24.8">10 years earlier (e.g. 2020), over 3 consecutive years.</tspan><tspan x="530" dy="24.8">The relative change matters most.</tspan></text></g>
<path d="M1034.0,516 h10 v-9 l16,18 l-16,18 v-9 h-10 z" fill="#1F5F63"/>
<g id="panel3"><rect x="1066" y="170" width="778" height="710" rx="30" fill="#fff" stroke="#1F5F63" stroke-opacity=".35" stroke-width="2"/><circle cx="1106" cy="218" r="24.0" fill="#1F5F63"/><text x="1106" y="228.0" font-size="28" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="1146.0" y="230.0" font-size="36" fill="#1F5F63" font-weight="700">Bias correction and checks</text><text x="1090" y="268" font-size="21" fill="#22343A"><tspan x="1090" dy="0">The model usually under- or overestimates compared with measurements (bias). The</tspan><tspan x="1090" dy="24.8">correction depends on the cause: background or unknown sources, or modelled sources.</tspan></text><text x="1090" y="321" font-size="19" fill="#22343A" font-style="italic">invented example (µg/m³): the model underestimates by 5</text><path d="M1270.0,337 V545" stroke="#A9A59B" stroke-opacity=".5" stroke-width="1.6"/><text x="1270.0" y="569" font-size="19" fill="#22343A" text-anchor="middle">0</text><path d="M1312.5,337 V545" stroke="#A9A59B" stroke-opacity=".5" stroke-width="1.6"/><text x="1312.5" y="569" font-size="19" fill="#22343A" text-anchor="middle">5</text><path d="M1355.0,337 V545" stroke="#A9A59B" stroke-opacity=".5" stroke-width="1.6"/><text x="1355.0" y="569" font-size="19" fill="#22343A" text-anchor="middle">10</text><path d="M1397.5,337 V545" stroke="#A9A59B" stroke-opacity=".5" stroke-width="1.6"/><text x="1397.5" y="569" font-size="19" fill="#22343A" text-anchor="middle">15</text><path d="M1440.0,337 V545" stroke="#A9A59B" stroke-opacity=".5" stroke-width="1.6"/><text x="1440.0" y="569" font-size="19" fill="#22343A" text-anchor="middle">20</text><text x="1090" y="364.0" font-size="18" fill="#22343A">Assessment: model</text><rect x="1270.0" y="344.0" width="68.0" height="28" fill="#B4BFC3"/><rect x="1338.0" y="344.0" width="59.5" height="28" fill="#2A9D9A"/><text x="1405.5" y="365.0" font-size="19" fill="#22343A" font-weight="700">15.0</text><text x="1090" y="398.0" font-size="18" fill="#22343A">Assessment: obs.</text><rect x="1270.0" y="378.0" width="170.0" height="28" fill="#22343A"/><text x="1448.0" y="399.0" font-size="19" fill="#22343A" font-weight="700">20.0</text><text x="1090" y="432.0" font-size="18" fill="#22343A">Projection: none</text><rect x="1270.0" y="412.0" width="61.2" height="28" fill="#B4BFC3"/><rect x="1331.2" y="412.0" width="35.7" height="28" fill="#2A9D9A"/><text x="1374.9" y="433.0" font-size="19" fill="#22343A" font-weight="700">11.4</text><text x="1090" y="466.0" font-size="18" fill="#22343A">Projection: absolute</text><rect x="1270.0" y="446.0" width="61.2" height="28" fill="#B4BFC3"/><rect x="1331.2" y="446.0" width="35.7" height="28" fill="#2A9D9A"/><rect x="1366.9" y="446.0" width="42.5" height="28" fill="#C58B1A"/><text x="1417.4" y="467.0" font-size="19" fill="#22343A" font-weight="700">16.4</text><text x="1090" y="500.0" font-size="18" fill="#22343A">Projection: relative</text><rect x="1270.0" y="480.0" width="61.2" height="28" fill="#B4BFC3"/><rect x="1331.2" y="480.0" width="35.7" height="28" fill="#2A9D9A"/><rect x="1366.9" y="480.0" width="32.3" height="28" fill="#C58B1A"/><text x="1407.2" y="501.0" font-size="19" fill="#22343A" font-weight="700">15.2</text><text x="1090" y="534.0" font-size="18" fill="#22343A">Projection: combined</text><rect x="1270.0" y="514.0" width="61.2" height="28" fill="#B4BFC3"/><rect x="1331.2" y="514.0" width="25.5" height="28" fill="#C58B1A"/><rect x="1356.7" y="514.0" width="35.7" height="28" fill="#2A9D9A"/><rect x="1392.4" y="514.0" width="10.2" height="28" fill="#C58B1A"/><text x="1410.6" y="535.0" font-size="19" fill="#22343A" font-weight="700">15.6</text><rect x="1090.0" y="587" width="20" height="18" rx="3" fill="#B4BFC3"/><text x="1118" y="601" font-size="19" fill="#22343A">background</text><rect x="1220.0" y="587" width="20" height="18" rx="3" fill="#2A9D9A"/><text x="1248.0" y="601" font-size="19" fill="#22343A">local source</text><rect x="1365.2" y="587" width="20" height="18" rx="3" fill="#C58B1A"/><text x="1393.2" y="601" font-size="19" fill="#22343A">correction</text><text x="1504" y="361" font-size="23" fill="#1F5F63" font-weight="700">Absolute (+5 µg/m³)</text><text x="1504" y="389" font-size="21" fill="#22343A"><tspan x="1504" dy="0">The difference is added: for a wrong</tspan><tspan x="1504" dy="24.8">background or unknown sources.</tspan></text><text x="1504" y="448" font-size="23" fill="#1F5F63" font-weight="700">Relative (×1.33)</text><text x="1504" y="476" font-size="21" fill="#22343A"><tspan x="1504" dy="0">Multiplied by the same ratio. For</tspan><tspan x="1504" dy="24.8">modelled sources that the measures</tspan><tspan x="1504" dy="24.8">reduce.</tspan></text><text x="1504" y="560" font-size="23" fill="#1F5F63" font-weight="700">Combined</text><text x="1504" y="588" font-size="21" fill="#22343A"><tspan x="1504" dy="0">Relative for the sources, absolute</tspan><tspan x="1504" dy="24.8">for the background.</tspan></text><path d="M1090,637 H1820" stroke="#A9A59B" stroke-width="2"/><text x="1090.0" y="669" font-size="24" fill="#1F5F63" font-weight="700">Testing the correction on the past</text><text x="1090.0" y="701" font-size="21" fill="#22343A"><tspan x="1090.0" dy="0">Compute the correction for a past year</tspan><tspan x="1090.0" dy="24.8">(e.g. 2010) and apply it to a recent one</tspan><tspan x="1090.0" dy="24.8">(e.g. 2020): comparison with measurements</tspan><tspan x="1090.0" dy="24.8">shows whether the method works.</tspan></text><text x="1473.0" y="669" font-size="24" fill="#1F5F63" font-weight="700">Dynamic sensitivity</text><text x="1473.0" y="701" font-size="21" fill="#22343A"><tspan x="1473.0" dy="0">Doing well today does not guarantee</tspan><tspan x="1473.0" dy="24.8">responding well to reductions. It is</tspan><tspan x="1473.0" dy="24.8">checked with historical trends and with</tspan><tspan x="1473.0" dy="24.8">the DELTA module (FAIRMODE tool), which</tspan><tspan x="1473.0" dy="24.8">tests the model by night and day, on</tspan><tspan x="1473.0" dy="24.8">weekdays and weekends.</tspan></text></g>
<g id="definition"><rect x="36" y="910" width="1848" height="120" rx="28" fill="#1F5F63"/><text x="74" y="960" font-size="27" fill="#fff"><tspan font-weight="700">Five uncertainties:</tspan> future emissions, background, meteorology, bias correction, dynamic sensitivity: to check and, where possible, quantify.</text><text x="74" y="1000" font-size="27" fill="#fff">Every choice changes the result: it must be declared, with an uncertainty range where possible.</text></g>
</svg>
