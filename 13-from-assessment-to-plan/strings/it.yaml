# Stringhe italiane (versione 2, archetipo «linea dei tempi»): etichette brevi, niente paragrafi.
# Pochi termini inglesi, solo quelli necessari (roadmap, screening, source apportionment).
lang: it
alt_title: "Dalla valutazione al piano: tempi e passi"
alt_desc: >-
  Infografica con linea dei tempi. In alto due binari: il piano (superamento registrato nell'anno Y, piano adottato entro
  Y+2, fine del superamento entro la fine di Y+4, con un esempio 2027, 2029, 2031; piano aggiornato se non basta;
  reporting entro due mesi) e la roadmap (2026-2030: superamento previsto di valori da rispettare nel 2030, roadmap entro
  due anni dal superamento, ultima data per chiedere la proroga il 31 dicembre 2028). In basso: le cinque tappe per
  costruire un piano, che cosa deve dire il piano e la cooperazione tra Stati.
title: "Dalla valutazione al piano: tempi e passi"
