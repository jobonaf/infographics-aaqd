<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" lang="en" font-family="'Source Sans 3','Source Sans Pro','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">From assessment to the plan: timing and steps</title>
<desc id="d">Infographic with a timeline. Top, two tracks: the plan (exceedance recorded in year Y, plan adopted by Y+2, end of the exceedance by the end of Y+4, with an example 2027, 2029, 2031; plan updated if not enough; reporting within two months) and the roadmap (2026-2030: exceedance expected of values to be met in 2030, roadmap within two years of the exceedance, last date to ask for a postponement 31 December 2028). Bottom: the five steps to build a plan, what the plan must say and cooperation between States.</desc>
<rect id="background" width="1920" height="1080" fill="#EFEBDD"/>
<text x="48" y="76" font-size="58" fill="#1F5F63" font-weight="700">From assessment to the plan: timing and steps</text>
<text x="48" y="122" font-size="30" fill="#22343A">Commission technical support document (April 2025), §5.1 and §5.2 · Dir. (EU) 2024/2881, Arts. 18, 19 and 21</text>
<g id="timeline"><rect x="36" y="150" width="1848" height="470" rx="30" fill="#fff" stroke="#B7C6C4" stroke-width="2.6"/><text x="64" y="260" font-size="32" fill="#1F5F63" font-weight="700">PLAN</text><path d="M300,250 H1790" stroke="#1F5F63" stroke-width="5" stroke-linecap="round"/><path d="M1772,239 l18,11 l-18,11" fill="none" stroke="#1F5F63" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="420" y="243" width="1080" height="14" fill="#D7372B" fill-opacity=".4"/><path d="M420,198 V190 H1500 V198" fill="none" stroke="#B5302A" stroke-width="2.6"/><text x="960.0" y="180" font-size="22" fill="#B5302A" font-style="italic" text-anchor="middle">exceedance period: 4 years at most</text><circle cx="420" cy="250" r="14" fill="#1F5F63" stroke="#fff" stroke-width="3.4"/><text x="420" y="228" font-size="34" fill="#1F5F63" font-weight="700" text-anchor="middle">Y</text><circle cx="420" cy="312" r="26" fill="#2A9D9A" fill-opacity=".12"/><g transform="translate(420,312)" fill="none" stroke="#1F5F63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-21 L21,17 H-21 Z"/><path d="M0,-8 V5"/><circle cy="11" r="1.4" fill="#1F5F63"/></g><text x="420" y="374" font-size="22" fill="#22343A" text-anchor="middle"><tspan x="420" dy="0">exceedance</tspan><tspan x="420" dy="24.2">recorded</tspan></text><text x="420" y="430" font-size="20" fill="#22343A" font-style="italic" text-anchor="middle">e.g. 2027</text><circle cx="960.0" cy="250" r="14" fill="#1F5F63" stroke="#fff" stroke-width="3.4"/><text x="960.0" y="228" font-size="34" fill="#1F5F63" font-weight="700" text-anchor="middle">Y + 2</text><circle cx="960.0" cy="312" r="26" fill="#2A9D9A" fill-opacity=".12"/><g transform="translate(960.0,312)" fill="none" stroke="#1F5F63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-14,-22 H6 L16,-12 V22 H-14 Z M6,-22 V-12 H16 M-7,-2 H9 M-7,7 H9 M-7,15 H3"/></g><text x="960.0" y="374" font-size="22" fill="#22343A" text-anchor="middle"><tspan x="960.0" dy="0">plan adopted,</tspan><tspan x="960.0" dy="24.2">at the latest</tspan></text><text x="960.0" y="430" font-size="20" fill="#22343A" font-style="italic" text-anchor="middle">e.g. 2029</text><text x="960.0" y="458" font-size="20" fill="#1F5F63" font-weight="700" text-anchor="middle">reporting within 2 months</text><circle cx="1500" cy="250" r="14" fill="#1F5F63" stroke="#fff" stroke-width="3.4"/><text x="1500" y="228" font-size="34" fill="#1F5F63" font-weight="700" text-anchor="middle">end of Y + 4</text><circle cx="1500" cy="312" r="26" fill="#2A9D9A" fill-opacity=".12"/><g transform="translate(1500,312)" fill="none" stroke="#1F5F63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-14,22 V-22"/><path d="M-14,-22 H16 L8,-12 L16,-2 H-14"/></g><text x="1500" y="374" font-size="22" fill="#22343A" text-anchor="middle"><tspan x="1500" dy="0">end of the exceedance,</tspan><tspan x="1500" dy="24.2">at the latest</tspan></text><text x="1500" y="430" font-size="20" fill="#22343A" font-style="italic" text-anchor="middle">e.g. 2031</text><path d="M1712.8,324.0 A24,24 0 1 1 1712.8,300.0" fill="none" stroke="#8A5F0C" stroke-width="4.2" stroke-linecap="round"/><polygon points="1715.5,304.8 1717.1,297.5 1708.5,302.5" fill="#8A5F0C"/><text x="1726" y="308" font-size="19" fill="#8A5F0C" font-weight="700"><tspan x="1726" dy="0">if not enough:</tspan><tspan x="1726" dy="21.3">updated plan</tspan></text><path d="M64,466 H1860" stroke="#B7C6C4" stroke-width="2"/><text x="64" y="530" font-size="32" fill="#1F5F63" font-weight="700">ROADMAP</text><path d="M300,520 H1790" stroke="#1F5F63" stroke-width="5" stroke-linecap="round"/><path d="M1772,509 l18,11 l-18,11" fill="none" stroke="#1F5F63" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="420" y="513" width="1080" height="14" fill="#D7372B" fill-opacity=".4"/><path d="M420,508 V532" stroke="#1F5F63" stroke-width="3.4"/><text x="420" y="560" font-size="24" fill="#22343A" text-anchor="middle">2026</text><path d="M690,508 V532" stroke="#1F5F63" stroke-width="3.4"/><text x="690" y="560" font-size="24" fill="#22343A" text-anchor="middle">2027</text><path d="M960,508 V532" stroke="#1F5F63" stroke-width="3.4"/><text x="960" y="560" font-size="24" fill="#22343A" text-anchor="middle">2028</text><path d="M1230,508 V532" stroke="#1F5F63" stroke-width="3.4"/><text x="1230" y="560" font-size="24" fill="#22343A" text-anchor="middle">2029</text><path d="M1500,508 V532" stroke="#1F5F63" stroke-width="3.4"/><text x="1500" y="560" font-size="24" fill="#1F5F63" font-weight="700" text-anchor="middle">2030</text><text x="430" y="494" font-size="22" fill="#22343A" font-style="italic">exceedance expected of values to be met in 2030</text><path d="M1230,520 V468" stroke="#8A5F0C" stroke-width="3.4"/><path d="M1230,468 H1264 L1254,478 L1264,488 H1230" fill="#C58B1A" stroke="#8A5F0C" stroke-width="2.4" stroke-linejoin="round"/><text x="1230" y="592" font-size="20" fill="#8A5F0C" font-weight="700" text-anchor="middle"><tspan x="1230" dy="0">31 Dec 2028: last date</tspan><tspan x="1230" dy="23.0">to ask for a postponement</tspan></text><circle cx="1500" cy="520" r="13" fill="#1F5F63" stroke="#fff" stroke-width="3.4"/><text x="1500" y="592" font-size="20" fill="#1F5F63" font-weight="700" text-anchor="middle"><tspan x="1500" dy="0">deadline</tspan><tspan x="1500" dy="23.0">for the values</tspan></text><text x="420" y="592" font-size="20" fill="#22343A" font-style="italic"><tspan x="420" dy="0">roadmap within 2 years</tspan><tspan x="420" dy="23.0">of the exceedance</tspan></text></g>
<g id="steps"><rect x="36" y="640" width="880" height="250" rx="30" fill="#fff" stroke="#B7C6C4" stroke-width="2.6"/><text x="64" y="682" font-size="27" fill="#1F5F63" font-weight="700">Five steps</text><polygon points="64.0,702.0 208.0,702.0 228.0,733.0 208.0,764.0 64.0,764.0" fill="#1F5F63" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/><text x="144.0" y="741.0" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">Assessment</text><text x="140.0" y="796" font-size="21" fill="#22343A" text-anchor="middle"><tspan x="140.0" dy="0">Where, how much,</tspan><tspan x="140.0" dy="24.1">by whom?</tspan></text><polygon points="218.0,702.0 362.0,702.0 382.0,733.0 362.0,764.0 218.0,764.0 238.0,733.0" fill="#1F5F63" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/><text x="308.0" y="741.0" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">Screening</text><text x="294.0" y="796" font-size="21" fill="#22343A" text-anchor="middle"><tspan x="294.0" dy="0">Which sources</tspan><tspan x="294.0" dy="24.1">matter?</tspan></text><polygon points="372.0,702.0 516.0,702.0 536.0,733.0 516.0,764.0 372.0,764.0 392.0,733.0" fill="#1F5F63" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/><text x="462.0" y="741.0" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">Measures</text><text x="448.0" y="796" font-size="21" fill="#22343A" text-anchor="middle"><tspan x="448.0" dy="0">What can be</tspan><tspan x="448.0" dy="24.1">done?</tspan></text><polygon points="526.0,702.0 670.0,702.0 690.0,733.0 670.0,764.0 526.0,764.0 546.0,733.0" fill="#1F5F63" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/><text x="616.0" y="741.0" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">Scenarios</text><text x="602.0" y="796" font-size="21" fill="#22343A" text-anchor="middle">Enough? By when?</text><polygon points="680.0,702.0 824.0,702.0 844.0,733.0 824.0,764.0 680.0,764.0 700.0,733.0" fill="#1F5F63" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/><text x="770.0" y="741.0" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">Adoption</text><text x="756.0" y="796" font-size="21" fill="#22343A" text-anchor="middle"><tspan x="756.0" dy="0">Consultation,</tspan><tspan x="756.0" dy="24.1">reporting</tspan></text></g>
<g id="say"><rect x="936" y="640" width="640" height="250" rx="30" fill="#fff" stroke="#B7C6C4" stroke-width="2.6"/><text x="964" y="682" font-size="27" fill="#1F5F63" font-weight="700">The plan must say</text><circle cx="986" cy="728" r="22" fill="#2A9D9A" fill-opacity=".12"/><g transform="translate(986,728)" fill="none" stroke="#1F5F63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0,22 C-14,6 -17,0 -17,-8 a17,17 0 0 1 34,0 c0,8 -3,14 -17,30z"/><circle cy="-8" r="5"/></g><text x="1020" y="728" font-size="22" fill="#22343A" font-weight="700">where</text><text x="1020" y="752" font-size="19" fill="#22343A">points in exceedance</text><circle cx="1286" cy="728" r="22" fill="#2A9D9A" fill-opacity=".12"/><g transform="translate(1286,728)" fill="none" stroke="#1F5F63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-20,-4 L-8,-20 L14,-14 L20,6 L4,20 L-16,14 Z"/></g><text x="1320" y="728" font-size="22" fill="#22343A" font-weight="700">how much</text><text x="1320" y="752" font-size="19" fill="#22343A">km², people exposed</text><circle cx="986" cy="784" r="22" fill="#2A9D9A" fill-opacity=".12"/><g transform="translate(986,784)" fill="none" stroke="#1F5F63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-20,20 V-2 H-6 V20 M-6,20 V-22 H8 V20 M8,20 H22 M-24,20 H24"/></g><text x="1020" y="784" font-size="22" fill="#22343A" font-weight="700">from where</text><text x="1020" y="808" font-size="19" fill="#22343A">sources, contributions</text><circle cx="1286" cy="784" r="22" fill="#2A9D9A" fill-opacity=".12"/><g transform="translate(1286,784)" fill="none" stroke="#1F5F63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle r="11"/><circle r="4"/><path d="M15.0,0.0 L22.0,0.0"/><path d="M10.6,10.6 L15.6,15.6"/><path d="M0.0,15.0 L0.0,22.0"/><path d="M-10.6,10.6 L-15.6,15.6"/><path d="M-15.0,0.0 L-22.0,0.0"/><path d="M-10.6,-10.6 L-15.6,-15.6"/><path d="M-0.0,-15.0 L-0.0,-22.0"/><path d="M10.6,-10.6 L15.6,-15.6"/></g><text x="1320" y="784" font-size="22" fill="#22343A" font-weight="700">which measures</text><text x="1320" y="808" font-size="19" fill="#22343A">timetable, who</text><circle cx="986" cy="840" r="22" fill="#2A9D9A" fill-opacity=".12"/><g transform="translate(986,840)" fill="none" stroke="#1F5F63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-20,-20 V20 H20"/><path d="M-14,2 H16" stroke-dasharray="5 5"/></g><text x="1020" y="840" font-size="22" fill="#22343A" font-weight="700">baseline</text><text x="1020" y="864" font-size="19" fill="#22343A">with no new action</text><circle cx="1286" cy="840" r="22" fill="#2A9D9A" fill-opacity=".12"/><g transform="translate(1286,840)" fill="none" stroke="#1F5F63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-9,-10 a9,9 0 1 1 13,8 c-3,2 -4,4 -4,8"/><circle cy="17" r="1.6" fill="#1F5F63"/></g><text x="1320" y="840" font-size="22" fill="#22343A" font-weight="700">uncertainty</text><text x="1320" y="864" font-size="19" fill="#22343A">best and worst case</text></g>
<g id="coop"><rect x="1596" y="640" width="288" height="250" rx="30" fill="#fff" stroke="#B7C6C4" stroke-width="2.6"/><text x="1620" y="682" font-size="27" fill="#1F5F63" font-weight="700">Several States</text><path d="M1636,704 q-14,10 -10,30 q4,22 28,24 q22,0 28,-22 q4,-24 -14,-34 q-18,-6 -32,2 z" fill="#2A9D9A" fill-opacity=".25" stroke="#1F5F63" stroke-width="3"/><path d="M1800,708 q18,-8 34,4 q12,16 4,36 q-12,22 -36,16 q-22,-8 -20,-34 q2,-14 18,-22 z" fill="#C58B1A" fill-opacity=".3" stroke="#8A5F0C" stroke-width="3"/><path d="M1706,734 H1776" stroke="#1F5F63" stroke-width="4" stroke-linecap="round"/><path d="M1764,725 l12,9 l-12,9" fill="none" stroke="#1F5F63" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M1710,720 q6,-8 12,0 t12,0 t12,0" fill="none" stroke="#1F5F63" stroke-width="2.4" stroke-linecap="round"/><text x="1620" y="798" font-size="20" fill="#22343A"><tspan x="1620" dy="0">If the pollution comes</tspan><tspan x="1620" dy="23.6">from another State:</tspan><tspan x="1620" dy="23.6">they cooperate (Art. 21),</tspan><tspan x="1620" dy="23.6">reply within 3 months</tspan></text></g>
<g id="definition"><rect x="36" y="910" width="1848" height="120" rx="28" fill="#1F5F63"/><text x="74" y="960" font-size="27" fill="#fff"><tspan font-weight="700">Plan and roadmap:</tspan> say which measures, by when, to meet the limits where they are exceeded, or expected to be in 2030.</text><text x="74" y="1000" font-size="27" fill="#fff">They start from the assessment and the source apportionment; scenarios show whether the measures are enough.</text></g>
</svg>
