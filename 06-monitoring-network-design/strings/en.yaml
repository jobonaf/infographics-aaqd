# English strings. Decimal separator: point.
lang: en
alt_title: "Designing the monitoring network with models"
alt_desc: >-
  Invented schematic map of a city with modelled concentration bands (red where high), existing stations, a traffic
  hotspot and two background stations, urban and rural. On the right three messages: the hotspot is where the model
  shows the highest concentration; background is in areas not dominated by a single source; up to 50% fewer fixed
  stations, in zones below the limit values and under three conditions. An inset explains MoNET, which groups areas by
  pattern and level of pollution and flags redundant stations and gaps. At the bottom: review at least every 5 years.
