# Stringhe italiane. Separatore decimale: virgola.
lang: it
alt_title: "Progettare la rete di monitoraggio con i modelli"
alt_desc: >-
  Mappa schematica inventata di una città con fasce di concentrazione modellata (rosso dove è alta), stazioni esistenti,
  un hotspot da traffico e due stazioni di fondo, urbano e rurale. A destra tre messaggi: l'hotspot è dove il modello
  indica la concentrazione massima; il fondo è in zone non dominate da una sola sorgente; fino al 50% di stazioni fisse
  in meno, in zone sotto i valori limite e a tre condizioni. Un riquadro spiega MoNET, che raggruppa le zone per
  andamento e livello di inquinamento e segnala stazioni ridondanti e lacune. In basso: revisione almeno ogni 5 anni.
