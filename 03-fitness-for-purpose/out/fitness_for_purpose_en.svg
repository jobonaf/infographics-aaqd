<circle cx="1148.4" cy="346.5" r="8" fill="#1F5F63"/>
<path d="M1324,450 L1175.0,450.0" stroke="#1F5F63" stroke-width="5" stroke-linecap="round"/>
<circle cx="1175.0" cy="450.0" r="8" fill="#1F5F63"/>
<path d="M1324,650 L1148.4,553.5" stroke="#1F5F63" stroke-width="5" stroke-linecap="round"/>
<circle cx="1148.4" cy="553.5" r="8" fill="#1F5F63"/>
</g>
<g id="hub">
<circle cx="960" cy="450" r="215" fill="#fff" stroke="#1F5F63" stroke-width="7"/>
<text x="960" y="350" font-size="46" fill="#1F5F63" font-weight="700" text-anchor="middle"><tspan x="960" dy="0">Fit for</tspan><tspan x="960" dy="52.9">purpose?</tspan></text>
<circle cx="960" cy="546" r="98" fill="#C58B1A" fill-opacity=".16" stroke="#C58B1A" stroke-width="5"/>
<text x="960" y="522" font-size="24" fill="#8A5F0C" font-weight="700" text-anchor="middle"><tspan x="960" dy="0">MQO</tspan><tspan x="960" dy="31.2">necessary,</tspan><tspan x="960" dy="31.2">not sufficient</tspan></text>
</g>
<g id="criteria">
<g id="criterion-1"><rect x="36" y="175.0" width="560" height="150" rx="28" fill="#fff" stroke="#B7C6C4" stroke-width="2.6"/><circle cx="96" cy="250" r="36" fill="#2A9D9A" fill-opacity=".12"/><g transform="translate(96,250)" fill="none" stroke="#1F5F63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-21,-14 H21 M-14,-21 V21"/><path d="M-21,0 H21 M0,-21 V21"/><path d="M-21,14 H21 M14,-21 V21"/></g><text x="154" y="244.0" font-size="31" fill="#1F5F63" font-weight="700">adequate resolution</text><text x="154" y="278.0" font-size="21" fill="#22343A">e.g. urban NO₂: roads and street canyons</text></g>
<g id="criterion-2"><rect x="36" y="375.0" width="560" height="150" rx="28" fill="#fff" stroke="#B7C6C4" stroke-width="2.6"/><circle cx="96" cy="450" r="36" fill="#2A9D9A" fill-opacity=".12"/><g transform="translate(96,450)" fill="none" stroke="#1F5F63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle r="11"/><circle r="4"/><path d="M15.0,0.0 L22.0,0.0"/><path d="M10.6,10.6 L15.6,15.6"/><path d="M0.0,15.0 L0.0,22.0"/><path d="M-10.6,10.6 L-15.6,15.6"/><path d="M-15.0,0.0 L-22.0,0.0"/><path d="M-10.6,-10.6 L-15.6,-15.6"/><path d="M-0.0,-15.0 L-0.0,-22.0"/><path d="M10.6,-10.6 L15.6,-15.6"/></g><text x="154" y="444.0" font-size="31" fill="#1F5F63" font-weight="700">relevant processes</text><text x="154" y="478.0" font-size="21" fill="#22343A">suited to scale, application and pollutant</text></g>
<g id="criterion-3"><rect x="36" y="575.0" width="560" height="150" rx="28" fill="#fff" stroke="#B7C6C4" stroke-width="2.6"/><circle cx="96" cy="650" r="36" fill="#2A9D9A" fill-opacity=".12"/><g transform="translate(96,650)" fill="none" stroke="#1F5F63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-20,20 V-2 H-6 V20 M-6,20 V-22 H8 V20 M8,20 H22 M-24,20 H24"/></g><text x="154" y="631.0" font-size="31" fill="#1F5F63" font-weight="700">relevant sources</text><text x="154" y="665.0" font-size="21" fill="#22343A"><tspan x="154" dy="0">e.g. forecasts: domestic heating varies with</tspan><tspan x="154" dy="26.0">temperature</tspan></text></g>
<g id="criterion-4"><rect x="1324" y="175.0" width="560" height="150" rx="28" fill="#fff" stroke="#B7C6C4" stroke-width="2.6"/><circle cx="1384" cy="250" r="36" fill="#2A9D9A" fill-opacity=".12"/><g transform="translate(1384,250)" fill="none" stroke="#1F5F63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-22,6 C-14,-18 -6,-18 0,0 C6,18 14,18 22,-6"/><path d="M-22,20 H22" stroke-width="2.6"/></g><text x="1442" y="231.0" font-size="31" fill="#1F5F63" font-weight="700">suitable meteorology</text><text x="1442" y="265.0" font-size="21" fill="#22343A"><tspan x="1442" dy="0">e.g. resolution similar to the air quality</tspan><tspan x="1442" dy="26.0">model’s</tspan></text></g>
<g id="criterion-5"><rect x="1324" y="375.0" width="560" height="150" rx="28" fill="#fff" stroke="#B7C6C4" stroke-width="2.6"/><circle cx="1384" cy="450" r="36" fill="#2A9D9A" fill-opacity=".12"/><g transform="translate(1384,450)" fill="none" stroke="#1F5F63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle r="21"/><path d="M-10,1 L-3,9 L11,-9"/></g><text x="1442" y="431.0" font-size="31" fill="#1F5F63" font-weight="700">validation and MQO</text><text x="1442" y="465.0" font-size="21" fill="#22343A"><tspan x="1442" dy="0">MQO: modelling quality objective; threshold on</tspan><tspan x="1442" dy="26.0">the gap between model and measurements</tspan></text></g>
<g id="criterion-6"><rect x="1324" y="575.0" width="560" height="150" rx="28" fill="#fff" stroke="#B7C6C4" stroke-width="2.6"/><circle cx="1384" cy="650" r="36" fill="#2A9D9A" fill-opacity=".12"/><g transform="translate(1384,650)" fill="none" stroke="#1F5F63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-14,-22 H6 L16,-12 V22 H-14 Z M6,-22 V-12 H16 M-7,-2 H9 M-7,7 H9 M-7,15 H3"/></g><text x="1442" y="631.0" font-size="31" fill="#1F5F63" font-weight="700">documentation</text><text x="1442" y="665.0" font-size="21" fill="#22343A"><tspan x="1442" dy="0">system and validation described for the</tspan><tspan x="1442" dy="26.0">application</tspan></text></g>
</g>
