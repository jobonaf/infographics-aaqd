<circle cx="771.6" cy="346.5" r="8" fill="#1F5F63"/>
<path d="M596,450 L745.0,450.0" stroke="#1F5F63" stroke-width="5" stroke-linecap="round"/>
<circle cx="745.0" cy="450.0" r="8" fill="#1F5F63"/>
