<circle cx="1738.0" cy="802" r="32" fill="#2A9D9A" fill-opacity=".12"/><g transform="translate(1738.0,802)" fill="none" stroke="#1F5F63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-22,6 C-14,-18 -6,-18 0,0 C6,18 14,18 22,-6"/><path d="M-22,20 H22" stroke-width="2.6"/></g>
<text x="1738.0" y="870" font-size="23" fill="#22343A" font-weight="700" text-anchor="middle">Forecasts</text>
</g>
