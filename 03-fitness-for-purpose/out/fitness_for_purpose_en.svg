<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" lang="en" font-family="'Source Sans 3','Source Sans Pro','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Fitness-for-purpose: when a model is fit for its purpose</title>
<desc id="d">Infographic in three panels. 1: the six fitness-for-purpose criteria of a modelling system and the quality control of the inputs before every simulation. 2: how the principle applies to the five domains of the directive: monitoring network (four levels of method for representativeness areas and the MoNET tool), assessment, source apportionment (green, orange, grey colour code), plans (emulators) and forecasting; source apportionment and plans have stricter conditions. 3: the MQO is necessary but not sufficient; related tools and standards.</desc>
<rect id="background" width="1920" height="1080" fill="#EFEBDD"/>
<text x="48" y="86" font-size="58" fill="#1F5F63" font-weight="700">Fitness-for-purpose: when a model is fit for its purpose</text>
<text x="48" y="134" font-size="30" fill="#22343A">Commission technical support document (April 2025), §1.5 and §3.3 · Dir. (EU) 2024/2881</text>
<g id="panel1"><rect x="36" y="170" width="450" height="710" rx="30" fill="#fff" stroke="#1F5F63" stroke-opacity=".35" stroke-width="2"/><circle cx="76" cy="218" r="24.0" fill="#1F5F63"/><text x="76" y="228.0" font-size="28" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="116.0" y="230.0" font-size="36" fill="#1F5F63" font-weight="700">Criteria and inputs</text><circle cx="90" cy="282" r="29" fill="#2A9D9A" fill-opacity=".10"/><g transform="translate(90,282)" fill="none" stroke="#1F5F63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-21,-14 H21 M-14,-21 V21"/><path d="M-21,0 H21 M0,-21 V21"/><path d="M-21,14 H21 M14,-21 V21"/></g><text x="140" y="278" font-size="21" fill="#22343A"><tspan x="140" dy="0">spatial and temporal resolution</tspan><tspan x="140" dy="25.6">suited to the application</tspan></text><circle cx="90" cy="348" r="29" fill="#2A9D9A" fill-opacity=".10"/><g transform="translate(90,348)" fill="none" stroke="#1F5F63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="-14" cy="12" r="6"/><circle cx="14" cy="14" r="6"/><circle cx="0" cy="-14" r="6"/><path d="M-10,-9 L-13,6 M4,-9 L12,8 M-8,13 H8"/></g><text x="140" y="344" font-size="21" fill="#22343A"><tspan x="140" dy="0">relevant physical-chemical</tspan><tspan x="140" dy="25.6">processes (or adequate data)</tspan></text><circle cx="90" cy="414" r="29" fill="#2A9D9A" fill-opacity=".10"/><g transform="translate(90,414)" fill="none" stroke="#1F5F63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-20,20 V-2 H-6 V20 M-6,20 V-22 H8 V20 M8,20 H22 M-24,20 H24"/><path d="M17,-10 q4,-5 8,0 M14,-20 q4,-5 8,0" stroke-width="2.6"/></g><text x="140" y="410" font-size="21" fill="#22343A"><tspan x="140" dy="0">relevant emission sources</tspan><tspan x="140" dy="25.6">adequately represented</tspan></text><circle cx="90" cy="480" r="29" fill="#2A9D9A" fill-opacity=".10"/><g transform="translate(90,480)" fill="none" stroke="#1F5F63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-16,12 a9,9 0 0 1 2,-17 a12,12 0 0 1 23,-3 a9,9 0 0 1 3,20 z"/></g><text x="140" y="476" font-size="21" fill="#22343A"><tspan x="140" dy="0">suitable meteorological data</tspan><tspan x="140" dy="25.6">to drive the simulations</tspan></text><circle cx="90" cy="546" r="29" fill="#2A9D9A" fill-opacity=".10"/><g transform="translate(90,546)" fill="none" stroke="#1F5F63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle r="21"/><path d="M-10,1 L-3,9 L11,-9"/></g><text x="140" y="542" font-size="21" fill="#22343A"><tspan x="140" dy="0">adequate validation</tspan><tspan x="140" dy="25.6">and MQO fulfilled</tspan></text><circle cx="90" cy="612" r="29" fill="#2A9D9A" fill-opacity=".10"/><g transform="translate(90,612)" fill="none" stroke="#1F5F63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-14,-22 H6 L16,-12 V22 H-14 Z M6,-22 V-12 H16 M-7,-2 H9 M-7,7 H9 M-7,15 H3"/></g><text x="140" y="608" font-size="21" fill="#22343A"><tspan x="140" dy="0">system and validation</tspan><tspan x="140" dy="25.6">well documented</tspan></text><text x="60" y="664" font-size="19" fill="#22343A" font-style="italic">criteria after Denby et al. (EEA, 2011)</text><path d="M60,682 H462" stroke="#A9A59B" stroke-width="2"/><text x="60" y="718" font-size="24" fill="#1F5F63" font-weight="700">Inputs need checking too</text><text x="60" y="752" font-size="21" fill="#22343A"><tspan x="60" dy="0">emissions, boundary conditions and meteorology</tspan><tspan x="60" dy="25.6">are checked before every simulation, not just</tspan><tspan x="60" dy="25.6">once; semi-automated, traceable, reproducible</tspan><tspan x="60" dy="25.6">pre-processing</tspan></text></g>
<path d="M494.0,516 h10 v-9 l16,18 l-16,18 v-9 h-10 z" fill="#1F5F63"/>
<g id="panel2"><rect x="526" y="170" width="780" height="710" rx="30" fill="#fff" stroke="#1F5F63" stroke-opacity=".35" stroke-width="2"/><circle cx="566" cy="218" r="24.0" fill="#1F5F63"/><text x="566" y="228.0" font-size="28" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="606.0" y="230.0" font-size="36" fill="#1F5F63" font-weight="700">Five domains, one principle</text><rect x="550" y="266" width="160" height="150" rx="14" fill="#1F5F63"/><text x="630.0" y="325.0" font-size="22" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="630.0" dy="0">Monitoring</tspan><tspan x="630.0" dy="25.1">network</tspan></text><text x="630.0" y="378.0" font-size="19" fill="#fff" text-anchor="middle">§2.4</text><text x="728" y="288" font-size="21" fill="#22343A">methods for representativeness areas; level 3+ advised:</text><rect x="728.0" y="300" width="132.0" height="54" rx="9" fill="#fff" stroke="#A9A59B" stroke-width="2.5"/><text x="794.0" y="323" font-size="20" fill="#22343A" text-anchor="middle"><tspan x="794.0" dy="0">1 · expert</tspan><tspan x="794.0" dy="22.0">judgement</tspan></text><rect x="868.0" y="300" width="132.0" height="54" rx="9" fill="#fff" stroke="#A9A59B" stroke-width="2.5"/><text x="934.0" y="323" font-size="20" fill="#22343A" text-anchor="middle"><tspan x="934.0" dy="0">2 · proxy data</tspan><tspan x="934.0" dy="22.0">or campaigns</tspan></text><rect x="1008.0" y="300" width="132.0" height="54" rx="9" fill="#1F5F63" stroke="#1F5F63" stroke-width="2.5"/><text x="1074.0" y="323" font-size="20" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="1074.0" dy="0">3 · validated</tspan><tspan x="1074.0" dy="22.0">model</tspan></text><rect x="1148.0" y="300" width="132.0" height="54" rx="9" fill="#1F5F63" stroke="#1F5F63" stroke-width="2.5"/><text x="1214.0" y="323" font-size="20" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="1214.0" dy="0">4 · model +</tspan><tspan x="1214.0" dy="22.0">measurements</tspan></text><text x="728" y="378" font-size="21" fill="#22343A"><tspan x="728" dy="0">MoNET (FAIRMODE): web app that groups zones by pollution regime</tspan><tspan x="728" dy="25.6">and flags redundant stations and network gaps.</tspan></text><rect x="550" y="430" width="160" height="76" rx="14" fill="#1F5F63"/><text x="630.0" y="464.5" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">Assessment</text><text x="630.0" y="492.5" font-size="19" fill="#fff" text-anchor="middle">§3.3</text><text x="728" y="454" font-size="21" fill="#22343A"><tspan x="728" dy="0">reproduce all observed levels, both background and traffic, in</tspan><tspan x="728" dy="25.6">space and in time</tspan></text><rect x="550" y="520" width="160" height="100" rx="14" fill="#1F5F63"/><text x="630.0" y="554.0" font-size="22" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="630.0" dy="0">Source</tspan><tspan x="630.0" dy="25.1">apportionment</tspan></text><text x="630.0" y="607.0" font-size="19" fill="#fff" text-anchor="middle">§4.3.1</text><text x="728" y="542" font-size="21" fill="#22343A">method suited to scope (assessment or plan) and pollutant:</text><rect x="728.0" y="554" width="120.8" height="32" rx="9" fill="#7DB46C"/><text x="788.4" y="577" font-size="19" fill="#22343A" font-weight="700" text-anchor="middle">green: suited</text><rect x="858.8" y="554" width="196.8" height="32" rx="9" fill="#EBA04A"/><text x="957.1999999999999" y="577" font-size="19" fill="#22343A" font-weight="700" text-anchor="middle">orange: with conditions</text><rect x="1065.6" y="554" width="143.6" height="32" rx="9" fill="#C3CACD"/><text x="1137.3999999999999" y="577" font-size="19" fill="#22343A" font-weight="700" text-anchor="middle">grey: not suited</text><text x="728" y="612" font-size="21" fill="#22343A">e.g. a receptor model is not suited for NO2 (grey)</text><rect x="550" y="634" width="160" height="92" rx="14" fill="#1F5F63"/><text x="630.0" y="664.0" font-size="22" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="630.0" dy="0">Plans and</tspan><tspan x="630.0" dy="25.1">roadmaps</tspan></text><text x="630.0" y="717.0" font-size="19" fill="#fff" text-anchor="middle">§5.4.1</text><text x="728" y="658" font-size="21" fill="#22343A"><tspan x="728" dy="0">link emissions to concentrations for future scenarios, at the</tspan><tspan x="728" dy="25.6">scale of the exceedance (point, area, region); emulators:</tspan><tspan x="728" dy="25.6">statistical or ML models that mimic a full model, faster</tspan></text><rect x="1286" y="520" width="7" height="206" rx="3.5" fill="#C58B1A"/><rect x="550" y="740" width="160" height="92" rx="14" fill="#1F5F63"/><text x="630.0" y="782.5" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">Forecasting</text><text x="630.0" y="810.5" font-size="19" fill="#fff" text-anchor="middle">§6.3</text><text x="728" y="764" font-size="21" fill="#22343A"><tspan x="728" dy="0">validate with measurements meeting the data quality rules of the</tspan><tspan x="728" dy="25.6">directive’s Annex V, over the whole forecast horizon (at least 3</tspan><tspan x="728" dy="25.6">days), day by day and over the long term</tspan></text><rect x="550" y="840" width="7" height="26" rx="3.5" fill="#C58B1A"/><text x="570" y="860" font-size="21" fill="#22343A" font-weight="700">stricter conditions on emissions and boundary conditions</text></g>
<path d="M1314.0,516 h10 v-9 l16,18 l-16,18 v-9 h-10 z" fill="#1F5F63"/>
<g id="panel3"><rect x="1346" y="170" width="538" height="710" rx="30" fill="#fff" stroke="#1F5F63" stroke-opacity=".35" stroke-width="2"/><circle cx="1386" cy="218" r="24.0" fill="#1F5F63"/><text x="1386" y="228.0" font-size="28" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="1426.0" y="230.0" font-size="36" fill="#1F5F63" font-weight="700">Beyond the MQO</text><circle cx="1458" cy="366" r="88" fill="#2A9D9A" fill-opacity=".10" stroke="#1F5F63" stroke-width="3.4"/><text x="1458" y="326" font-size="19" fill="#1F5F63" font-weight="700" text-anchor="middle"><tspan x="1458" dy="0">fitness-for-</tspan><tspan x="1458" dy="20.9">purpose</tspan></text><circle cx="1458" cy="396" r="34" fill="#1F5F63"/><text x="1458" y="404" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">MQO</text><text x="1572" y="326" font-size="23" fill="#1F5F63" font-weight="700"><tspan x="1572" dy="0">MQO: the modelling</tspan><tspan x="1572" dy="28.1">quality objective.</tspan><tspan x="1572" dy="28.1">Necessary, but</tspan><tspan x="1572" dy="28.1">not sufficient</tspan></text><circle cx="1380.0" cy="494.0" r="5.5" fill="#1F5F63" /><text x="1398" y="500" font-size="21" fill="#22343A"><tspan x="1398" dy="0">DELTA Tool: FAIRMODE software that computes MQI and MQO</tspan><tspan x="1398" dy="25.6">and produces harmonised diagrams and reports</tspan></text><circle cx="1380.0" cy="578.0" r="5.5" fill="#1F5F63" /><text x="1398" y="584" font-size="21" fill="#22343A"><tspan x="1398" dy="0">FAIRMODE (European forum for air quality modelling) also</tspan><tspan x="1398" dy="25.6">proposes quality control (QA/QC) criteria, checklists</tspan><tspan x="1398" dy="25.6">and a reporting scheme (Thunis and Tarrason, 2020)</tspan></text><circle cx="1380.0" cy="688.0" r="5.5" fill="#1F5F63" /><text x="1398" y="694" font-size="21" fill="#22343A"><tspan x="1398" dy="0">European standard CEN/TC 264/WG43 on model quality</tspan><tspan x="1398" dy="25.6">objectives: in preparation</tspan></text><circle cx="1380.0" cy="772.0" r="5.5" fill="#1F5F63" /><text x="1398" y="778" font-size="21" fill="#22343A"><tspan x="1398" dy="0">the directive requires reporting the model description</tspan><tspan x="1398" dy="25.6">and the MQO calculation</tspan></text></g>
<g id="definition"><rect x="36" y="910" width="1848" height="120" rx="28" fill="#1F5F63"/><text x="74" y="960" font-size="27" fill="#fff"><tspan font-weight="700">Fitness-for-purpose:</tspan> there are no good or bad models in absolute terms: quality is measured against the objectives of the specific application.</text><text x="74" y="1000" font-size="27" fill="#fff">Passing the MQO (modelling quality objective) is an essential, but not sufficient, condition.</text></g>
</svg>
