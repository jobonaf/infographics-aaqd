<circle cx="1006.0" cy="802" r="32" fill="#2A9D9A" fill-opacity=".12"/><g transform="translate(1006.0,802)" fill="none" stroke="#1F5F63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-20,-4 L-8,-20 L14,-14 L20,6 L4,20 L-16,14 Z"/></g>
