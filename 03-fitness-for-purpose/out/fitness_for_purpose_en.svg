<circle cx="762.0" cy="802" r="32" fill="#2A9D9A" fill-opacity=".12"/><g transform="translate(762.0,802)" fill="none" stroke="#1F5F63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0,22 C-14,6 -17,0 -17,-8 a17,17 0 0 1 34,0 c0,8 -3,14 -17,30z"/><circle cy="-8" r="5"/></g>
