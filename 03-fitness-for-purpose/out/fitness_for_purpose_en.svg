<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" lang="en" font-family="'Source Sans 3','Source Sans Pro','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">A model is fit for purpose, not good or bad in absolute terms</title>
<desc id="d">Hub infographic. At the centre the question &quot;Fit for purpose?&quot;, linked to six criteria: adequate resolution (example: urban NO2 with roads and street canyons), relevant processes, relevant sources, suitable meteorology, validation and MQO, documentation. A smaller circle inside the centre says that the MQO (modelling quality objective) is necessary but not sufficient. A row of five application areas (monitoring network, assessment, source apportionment, plans and roadmaps, forecasts) says: same question, different criteria for each application. A band at the bottom reminds that inputs must be checked before every simulation.</desc>
<rect width="1920" height="1080" fill="#EFEBDD"/>
<text x="48" y="76" font-size="58" fill="#1F5F63" font-weight="700">A model is fit for purpose, not good or bad in absolute terms</text><text x="48" y="122" font-size="30" fill="#22343A">Fitness-for-purpose · Commission technical support document (April 2025), §1.5, §3.3, §3.4.5 · Directive (EU) 2024/2881</text>
<g id="spokes">
