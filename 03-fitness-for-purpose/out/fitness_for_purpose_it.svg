<g id="criterion-4"><rect x="1324" y="175.0" width="560" height="150" rx="28" fill="#fff" stroke="#B7C6C4" stroke-width="2.6"/><circle cx="1384" cy="250" r="36" fill="#2A9D9A" fill-opacity=".12"/><g transform="translate(1384,250)" fill="none" stroke="#1F5F63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-22,6 C-14,-18 -6,-18 0,0 C6,18 14,18 22,-6"/><path d="M-22,20 H22" stroke-width="2.6"/></g><text x="1442" y="231.0" font-size="31" fill="#1F5F63" font-weight="700">meteorologia adatta</text><text x="1442" y="265.0" font-size="21" fill="#22343A"><tspan x="1442" dy="0">es. risoluzione simile a quella del modello di</tspan><tspan x="1442" dy="26.0">qualità dell’aria</tspan></text></g>
<g id="criterion-5"><rect x="1324" y="375.0" width="560" height="150" rx="28" fill="#fff" stroke="#B7C6C4" stroke-width="2.6"/><circle cx="1384" cy="450" r="36" fill="#2A9D9A" fill-opacity=".12"/><g transform="translate(1384,450)" fill="none" stroke="#1F5F63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle r="21"/><path d="M-10,1 L-3,9 L11,-9"/></g><text x="1442" y="431.0" font-size="31" fill="#1F5F63" font-weight="700">validazione e MQO</text><text x="1442" y="465.0" font-size="21" fill="#22343A"><tspan x="1442" dy="0">MQO: obiettivo di qualità della modellistica;</tspan><tspan x="1442" dy="26.0">soglia per lo scarto tra modello e misure</tspan></text></g>
<g id="criterion-6"><rect x="1324" y="575.0" width="560" height="150" rx="28" fill="#fff" stroke="#B7C6C4" stroke-width="2.6"/><circle cx="1384" cy="650" r="36" fill="#2A9D9A" fill-opacity=".12"/><g transform="translate(1384,650)" fill="none" stroke="#1F5F63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-14,-22 H6 L16,-12 V22 H-14 Z M6,-22 V-12 H16 M-7,-2 H9 M-7,7 H9 M-7,15 H3"/></g><text x="1442" y="631.0" font-size="31" fill="#1F5F63" font-weight="700">documentazione</text><text x="1442" y="665.0" font-size="21" fill="#22343A"><tspan x="1442" dy="0">sistema e validazione descritti per</tspan><tspan x="1442" dy="26.0">l’applicazione</tspan></text></g>
</g>
