<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" lang="it" font-family="'Source Sans 3','Source Sans Pro','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Un modello è adatto allo scopo, non buono in assoluto</title>
<desc id="d">Infografica con un hub. Al centro la domanda «Adatto allo scopo?», collegata a sei criteri: risoluzione adeguata (esempio: NO2 urbano con strade e canyon stradali), processi pertinenti, sorgenti rilevanti, meteorologia adatta, validazione e MQO, documentazione. Un cerchio più piccolo dentro il centro dice che l’MQO (obiettivo di qualità della modellistica) è necessario ma non sufficiente. Una riga con cinque ambiti (rete di monitoraggio, valutazione, attribuzione delle sorgenti, piani e roadmap, previsioni) dice: stessa domanda, criteri diversi per ambito. Una fascia in basso ricorda che gli input vanno controllati prima di ogni simulazione.</desc>
<rect width="1920" height="1080" fill="#EFEBDD"/>
<text x="48" y="76" font-size="58" fill="#1F5F63" font-weight="700">Un modello è adatto allo scopo, non buono in assoluto</text><text x="48" y="122" font-size="30" fill="#22343A">Fitness-for-purpose · Documento tecnico di supporto della Commissione (aprile 2025), §1.5, §3.3, §3.4.5 · Dir. (UE) 2024/2881</text>
