# English strings. Lists = pre-broken lines.
lang: en
alt_title: "A model is fit for purpose, not good or bad in absolute terms"
alt_desc: >-
  Hub infographic. At the centre the question "Fit for purpose?", linked to six criteria: adequate resolution
  (example: urban NO2 with roads and street canyons), relevant processes, relevant sources, suitable meteorology,
  validation and MQO, documentation. A smaller circle inside the centre says that the MQO (modelling quality objective)
  is necessary but not sufficient. A row of five application areas (monitoring network, assessment, source apportionment, plans
  and roadmaps, forecasts) says: same question, different criteria for each application. A band at the bottom reminds that
  inputs must be checked before every simulation.
title: "A model is fit for purpose, not good or bad in absolute terms"
subtitle: "Fitness-for-purpose · Commission technical support document (April 2025), §1.5, §3.3, §3.4.5 · Directive (EU) 2024/2881"
