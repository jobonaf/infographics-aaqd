# Stringhe italiane. Liste = righe già spezzate.
lang: it
alt_title: "Un modello è adatto allo scopo, non buono in assoluto"
alt_desc: >-
  Infografica con un hub. Al centro la domanda «Adatto allo scopo?», collegata a sei criteri: risoluzione adeguata
  (esempio: NO2 urbano con strade e canyon stradali), processi pertinenti, sorgenti rilevanti, meteorologia adatta,
  validazione e MQO, documentazione. Un cerchio più piccolo dentro il centro dice che l’MQO (obiettivo di qualità della
  modellistica) è necessario ma non sufficiente. Una riga con cinque ambiti (rete di monitoraggio, valutazione,
  attribuzione delle sorgenti, piani e roadmap, previsioni) dice: stessa domanda, criteri diversi per ambito. Una fascia
  in basso ricorda che gli input vanno controllati prima di ogni simulazione.
