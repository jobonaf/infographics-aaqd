<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" lang="it" font-family="'Source Sans 3','Source Sans Pro','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Gli scenari emissivi di un piano per la qualità dell&#x27;aria</title>
<desc id="d">Infografica in tre pannelli sugli scenari emissivi di un piano per la qualità dell&#x27;aria. 1: i sette tipi di scenario (riferimento, base, massima riduzione fattibile, riduzione necessaria, zero emissioni, misure selezionate, esposizione media) con che cosa mostrano e se la direttiva li richiede. 2: grafico a barre con un esempio inventato: la concentrazione in percentuale del limite nei diversi scenari, con l&#x27;intervallo tra caso migliore e peggiore per la base e per le misure selezionate. 3: come gestire l&#x27;incertezza (caso migliore e peggiore) e il numero di calcoli (spesso bastano due scenari).</desc>
<rect id="background" width="1920" height="1080" fill="#EFEBDD"/>
<text x="48" y="86" font-size="58" fill="#1F5F63" font-weight="700">Gli scenari emissivi di un piano per la qualità dell’aria</text>
<text x="48" y="134" font-size="30" fill="#22343A">Sette tipi di scenario · Documento tecnico di supporto della Commissione (aprile 2025), §5.2.4 · Dir. (UE) 2024/2881, Allegato VIII</text>
<g id="panel1"><rect x="36" y="170" width="820" height="710" rx="30" fill="#fff" stroke="#1F5F63" stroke-opacity=".35" stroke-width="2"/><circle cx="76" cy="218" r="24.0" fill="#1F5F63"/><text x="76" y="228.0" font-size="28" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="116.0" y="230.0" font-size="36" fill="#1F5F63" font-weight="700">Sette scenari</text><circle cx="79" cy="277" r="19" fill="#1F5F63"/><text x="79" y="285" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="110" y="284" font-size="24" fill="#1F5F63" font-weight="700">Riferimento (reference)</text><rect x="344.8" y="263" width="137.2" height="29" rx="14.5" fill="#fff" stroke="#A9A59B" stroke-width="2.2"/><text x="355.8" y="283" font-size="18" fill="#22343A">anno di partenza</text><text x="110" y="310" font-size="21" fill="#22343A"><tspan x="110" dy="0">L’ultimo anno con un superamento: da qui si parte; i confronti futuri usano la sua</tspan><tspan x="110" dy="24.8">meteorologia.</tspan></text><circle cx="79" cy="357" r="19" fill="#1F5F63"/><text x="79" y="365" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="110" y="364" font-size="24" fill="#1F5F63" font-weight="700">Base (baseline)</text><rect x="268.0" y="343" width="86.8" height="29" rx="14.5" fill="#1F5F63"/><text x="279.0" y="363" font-size="18" fill="#fff" font-weight="700">richiesto</text><text x="110" y="390" font-size="21" fill="#22343A"><tspan x="110" dy="0">Nell’anno di proiezione (anno futuro del piano) senza nuove azioni («business as</tspan><tspan x="110" dy="24.8">usual»): solo misure già adottate. Può già rispettare il limite.</tspan></text><circle cx="79" cy="437" r="19" fill="#1F5F63"/><text x="79" y="445" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="110" y="444" font-size="24" fill="#1F5F63" font-weight="700">Massima riduzione fattibile</text><rect x="383.2" y="423" width="295.6" height="29" rx="14.5" fill="#fff" stroke="#A9A59B" stroke-width="2.2"/><text x="394.2" y="443" font-size="18" fill="#22343A">se il limite non si raggiunge in tempo</text><text x="110" y="470" font-size="21" fill="#22343A"><tspan x="110" dy="0">Tutte le misure realisticamente possibili entro un certo tempo: tecniche, strutturali</tspan><tspan x="110" dy="24.8">o comportamentali. Mostra il meglio ottenibile.</tspan></text><circle cx="79" cy="517" r="19" fill="#1F5F63"/><text x="79" y="525" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="110" y="524" font-size="24" fill="#1F5F63" font-weight="700">Riduzione necessaria</text><rect x="316.0" y="503" width="115.6" height="29" rx="14.5" fill="#fff" stroke="#A9A59B" stroke-width="2.2"/><text x="327.0" y="523" font-size="18" fill="#22343A">casi semplici</text><text x="110" y="550" font-size="21" fill="#22343A"><tspan x="110" dy="0">Se domina una sola sorgente locale (es. il traffico): si stima il calo di emissioni</tspan><tspan x="110" dy="24.8">necessario, si cercano le misure e il modello verifica il limite.</tspan></text><circle cx="79" cy="597" r="19" fill="#1F5F63"/><text x="79" y="605" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="110" y="604" font-size="24" fill="#1F5F63" font-weight="700">Zero emissioni</text><rect x="258.4" y="583" width="166.0" height="29" rx="14.5" fill="#fff" stroke="#A9A59B" stroke-width="2.2"/><text x="269.4" y="603" font-size="18" fill="#22343A">non richiesto, utile</text><text x="110" y="630" font-size="21" fill="#22343A"><tspan x="110" dy="0">Senza le emissioni della zona: mostra quanto si può ottenere al massimo con riduzioni</tspan><tspan x="110" dy="24.8">locali. Serve un modello regionale; l’ozono può aumentare.</tspan></text><circle cx="79" cy="677" r="19" fill="#1F5F63"/><text x="79" y="685" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">6</text><text x="110" y="684" font-size="24" fill="#1F5F63" font-weight="700">Misure selezionate</text><rect x="296.8" y="663" width="223.6" height="29" rx="14.5" fill="#1F5F63"/><text x="307.8" y="683" font-size="18" fill="#fff" font-weight="700">richiesto, se i dati ci sono</text><text x="110" y="710" font-size="21" fill="#22343A"><tspan x="110" dy="0">L’effetto di ogni misura da sola. Per gli inquinanti reattivi le misure interagiscono,</tspan><tspan x="110" dy="24.8">quindi si valutano anche insieme, come pacchetto.</tspan></text><circle cx="79" cy="757" r="19" fill="#1F5F63"/><text x="79" y="765" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">7</text><text x="110" y="764" font-size="24" fill="#1F5F63" font-weight="700">Esposizione media (AEI)</text><rect x="344.8" y="743" width="396.4" height="29" rx="14.5" fill="#1F5F63"/><text x="355.8" y="763" font-size="18" fill="#fff" font-weight="700">richiesto se l’obbligo di riduzione non è rispettato</text><text x="110" y="790" font-size="21" fill="#22343A"><tspan x="110" dy="0">AEI = average exposure indicator: media di 3 anni consecutivi confrontata con quella</tspan><tspan x="110" dy="24.8">di 10 anni prima dell’anno di proiezione.</tspan></text></g>
<path d="M864.0,516 h10 v-9 l16,18 l-16,18 v-9 h-10 z" fill="#1F5F63"/>
<g id="panel2"><rect x="896" y="170" width="500" height="710" rx="30" fill="#fff" stroke="#1F5F63" stroke-opacity=".35" stroke-width="2"/><circle cx="936" cy="218" r="24.0" fill="#1F5F63"/><text x="936" y="228.0" font-size="28" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="976.0" y="230.0" font-size="36" fill="#1F5F63" font-weight="700">Che cosa cambia</text><text x="920" y="266" font-size="19" fill="#22343A" font-style="italic">esempio inventato: concentrazione in % del limite</text><path d="M1076.0,310 V606" stroke="#A9A59B" stroke-opacity=".5" stroke-width="1.6"/><text x="1076.0" y="634" font-size="20" fill="#22343A" text-anchor="middle">0</text><path d="M1172.7,310 V606" stroke="#A9A59B" stroke-opacity=".5" stroke-width="1.6"/><text x="1172.6666666666667" y="634" font-size="20" fill="#22343A" text-anchor="middle">50</text><path d="M1269.3,310 V606" stroke="#A9A59B" stroke-opacity=".5" stroke-width="1.6"/><text x="1269.3333333333333" y="634" font-size="20" fill="#22343A" text-anchor="middle">100</text><path d="M1366.0,310 V606" stroke="#A9A59B" stroke-opacity=".5" stroke-width="1.6"/><text x="1366.0" y="634" font-size="20" fill="#22343A" text-anchor="middle">150</text><text x="920" y="352.0" font-size="21" fill="#22343A">Riferimento</text><rect x="1076.0" y="330.0" width="261.0" height="30" rx="5" fill="#D7372B"/><text x="1086" y="352.0" font-size="20" fill="#fff" font-weight="700">135</text><text x="920" y="410.0" font-size="21" fill="#22343A">Base</text><rect x="1076.0" y="388.0" width="222.3" height="30" rx="5" fill="#D7372B"/><text x="1086" y="410.0" font-size="20" fill="#fff" font-weight="700">115</text><path d="M1277.1,403.0 H1323.5 M1277.1,394.0 v18 M1323.5,394.0 v18" stroke="#22343A" stroke-width="3.2" stroke-linecap="round" fill="none"/><text x="920" y="456.0" font-size="21" fill="#22343A"><tspan x="920" dy="0">Misure</tspan><tspan x="920" dy="23.1">selezionate</tspan></text><rect x="1076.0" y="446.0" width="170.1" height="30" rx="5" fill="#2A9D9A"/><text x="1086" y="468.0" font-size="20" fill="#fff" font-weight="700">88</text><path d="M1226.8,461.0 H1267.4 M1226.8,452.0 v18 M1267.4,452.0 v18" stroke="#22343A" stroke-width="3.2" stroke-linecap="round" fill="none"/><text x="920" y="526.0" font-size="21" fill="#22343A">Massima riduzione</text><rect x="1076.0" y="504.0" width="139.2" height="30" rx="5" fill="#2A9D9A"/><text x="1086" y="526.0" font-size="20" fill="#fff" font-weight="700">72</text><text x="920" y="584.0" font-size="21" fill="#22343A">Zero emissioni</text><rect x="1076.0" y="562.0" width="69.6" height="30" rx="5" fill="#2A9D9A"/><text x="1086" y="584.0" font-size="20" fill="#fff" font-weight="700">36</text><path d="M1269.3,302 V606" stroke="#22343A" stroke-width="3.4" stroke-dasharray="9 6"/><text x="1277.3333333333333" y="298" font-size="20" fill="#22343A" font-weight="700">limite</text><text x="1221.0" y="664" font-size="20" fill="#22343A" text-anchor="middle">concentrazione, % del limite</text><path d="M922,688 h40 M922,680 v16 M962,680 v16" stroke="#22343A" stroke-width="3.2" stroke-linecap="round" fill="none"/><text x="974" y="694" font-size="20" fill="#22343A">intervallo tra caso migliore e peggiore</text><text x="920" y="730" font-size="21" fill="#1F5F63" font-weight="700"><tspan x="920" dy="0">La distanza tra «Riferimento» e «Zero emissioni» è la</tspan><tspan x="920" dy="25.6">parte che dipende dalle emissioni della zona.</tspan></text><text x="920" y="790" font-size="21" fill="#22343A"><tspan x="920" dy="0">Lo scenario scelto rispetta il limite anche nel caso</tspan><tspan x="920" dy="25.6">peggiore.</tspan></text></g>
<path d="M1404.0,516 h10 v-9 l16,18 l-16,18 v-9 h-10 z" fill="#1F5F63"/>
<g id="panel3"><rect x="1436" y="170" width="448" height="710" rx="30" fill="#fff" stroke="#1F5F63" stroke-opacity=".35" stroke-width="2"/><circle cx="1476" cy="218" r="24.0" fill="#1F5F63"/><text x="1476" y="228.0" font-size="28" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="1516.0" y="230.0" font-size="36" fill="#1F5F63" font-weight="700">Incertezza e calcoli</text><text x="1460" y="270" font-size="25" fill="#1F5F63" font-weight="700">Caso migliore e peggiore</text><text x="1460" y="310" font-size="21" fill="#22343A"><tspan x="1460" dy="0">La direttiva chiede, dove possibile, un caso</tspan><tspan x="1460" dy="25.6">migliore, uno più probabile e uno peggiore</tspan><tspan x="1460" dy="25.6">(best, most likely, worst case), ottenuti con</tspan><tspan x="1460" dy="25.6">test di sensibilità: si fanno variare efficacia</tspan><tspan x="1460" dy="25.6">delle tecnologie, attuazione, adesione,</tspan><tspan x="1460" dy="25.6">esenzioni e controlli.</tspan></text><text x="1460" y="492" font-size="25" fill="#1F5F63" font-weight="700">Quanti calcoli?</text><text x="1460" y="532" font-size="21" fill="#22343A"><tspan x="1460" dy="0">Calcolare ogni misura e ogni caso porta a</tspan><tspan x="1460" dy="25.6">troppi scenari. Spesso ne bastano due per</tspan><tspan x="1460" dy="25.6">l’anno di proiezione: la base e lo scenario</tspan><tspan x="1460" dy="25.6">finale, che rispetta il limite. Se il limite</tspan><tspan x="1460" dy="25.6">non è raggiunto servono altre misure e altri</tspan><tspan x="1460" dy="25.6">scenari. Se serve l’AEI se ne aggiunge uno con</tspan><tspan x="1460" dy="25.6">le emissioni di 10 anni prima dell’anno di</tspan><tspan x="1460" dy="25.6">proiezione.</tspan></text><rect x="1460.0" y="758" width="61.6" height="38" rx="10" fill="#1F5F63"/><text x="1490.8" y="784" font-size="21" fill="#fff" font-weight="700" text-anchor="middle">Base</text><rect x="1533.6" y="758" width="78.4" height="38" rx="10" fill="#1F5F63"/><text x="1572.8" y="784" font-size="21" fill="#fff" font-weight="700" text-anchor="middle">Finale</text><rect x="1460.0" y="810" width="313.6" height="63" rx="10" fill="#fff" stroke="#1F5F63" stroke-width="2.6" stroke-dasharray="7 5"/><text x="1616.8" y="836" font-size="21" fill="#1F5F63" font-weight="700" text-anchor="middle"><tspan x="1616.8" dy="0">+ AEI: emissioni di 10 anni prima</tspan><tspan x="1616.8" dy="24.1">dell’anno di proiezione (se serve)</tspan></text></g>
<g id="definition"><rect x="36" y="910" width="1848" height="120" rx="28" fill="#1F5F63"/><text x="74" y="960" font-size="27" fill="#fff"><tspan font-weight="700">Scenario:</tspan> un calcolo con emissioni modificate rispetto all’anno di riferimento, a parità di meteorologia, per capire quanto servono le misure e quanto valgono.</text><text x="74" y="1000" font-size="27" fill="#fff">Il piano mostra che cosa succede senza nuove azioni (base) e con quali misure si rispetta il limite.</text></g>
</svg>
