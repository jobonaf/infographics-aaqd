<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" lang="en" font-family="'Source Sans 3','Source Sans Pro','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Emission scenarios of an air quality plan</title>
<desc id="d">Infographic in three panels on the emission scenarios of an air quality plan. 1: the seven scenario types (reference, baseline, maximum feasible reduction, required reduction, zero emission, selected measures, average exposure) with what they show and whether the directive requires them. 2: bar chart with an invented example: concentration as a percentage of the limit in the different scenarios, with the best-to-worst case range for the baseline and for the selected measures. 3: how to handle uncertainty (best and worst case) and the number of calculations (two scenarios are often enough).</desc>
<rect id="background" width="1920" height="1080" fill="#EFEBDD"/>
<text x="48" y="86" font-size="58" fill="#1F5F63" font-weight="700">Emission scenarios of an air quality plan</text>
<text x="48" y="134" font-size="30" fill="#22343A">Seven scenario types · Commission technical support document (April 2025), §5.2.4 · Dir. (EU) 2024/2881, Annex VIII</text>
<g id="panel1"><rect x="36" y="170" width="820" height="710" rx="30" fill="#fff" stroke="#1F5F63" stroke-opacity=".35" stroke-width="2"/><circle cx="76" cy="218" r="24.0" fill="#1F5F63"/><text x="76" y="228.0" font-size="28" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="116.0" y="230.0" font-size="36" fill="#1F5F63" font-weight="700">Seven scenarios</text><circle cx="79" cy="277" r="19" fill="#1F5F63"/><text x="79" y="285" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="110" y="284" font-size="24" fill="#1F5F63" font-weight="700">Reference</text><rect x="210.4" y="263" width="115.6" height="29" rx="14.5" fill="#fff" stroke="#A9A59B" stroke-width="2.2"/><text x="221.4" y="283" font-size="18" fill="#22343A">starting year</text><text x="110" y="310" font-size="21" fill="#22343A"><tspan x="110" dy="0">The latest year with an exceedance: the starting point; future comparisons use its</tspan><tspan x="110" dy="24.8">meteorology.</tspan></text><circle cx="79" cy="357" r="19" fill="#1F5F63"/><text x="79" y="365" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="110" y="364" font-size="24" fill="#1F5F63" font-weight="700">Baseline</text><rect x="200.8" y="343" width="79.6" height="29" rx="14.5" fill="#1F5F63"/><text x="211.8" y="363" font-size="18" fill="#fff" font-weight="700">required</text><text x="110" y="390" font-size="21" fill="#22343A"><tspan x="110" dy="0">In the projection year (future year of the plan) with no new action (“business as</tspan><tspan x="110" dy="24.8">usual”): only measures already adopted. It may already meet the limit.</tspan></text><circle cx="79" cy="437" r="19" fill="#1F5F63"/><text x="79" y="445" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="110" y="444" font-size="24" fill="#1F5F63" font-weight="700">Maximum feasible reduction</text><rect x="373.6" y="423" width="266.8" height="29" rx="14.5" fill="#fff" stroke="#A9A59B" stroke-width="2.2"/><text x="384.6" y="443" font-size="18" fill="#22343A">if the limit cannot be met in time</text><text x="110" y="470" font-size="21" fill="#22343A"><tspan x="110" dy="0">All realistically possible measures within a given time: technical, structural or</tspan><tspan x="110" dy="24.8">behavioural. It shows the best achievable.</tspan></text><circle cx="79" cy="517" r="19" fill="#1F5F63"/><text x="79" y="525" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="110" y="524" font-size="24" fill="#1F5F63" font-weight="700">Required reduction</text><rect x="296.8" y="503" width="108.4" height="29" rx="14.5" fill="#fff" stroke="#A9A59B" stroke-width="2.2"/><text x="307.8" y="523" font-size="18" fill="#22343A">simple cases</text><text x="110" y="550" font-size="21" fill="#22343A"><tspan x="110" dy="0">If one local source dominates (e.g. traffic): estimate the emission cut needed, look</tspan><tspan x="110" dy="24.8">for measures, and the model checks the limit.</tspan></text><circle cx="79" cy="597" r="19" fill="#1F5F63"/><text x="79" y="605" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="110" y="604" font-size="24" fill="#1F5F63" font-weight="700">Zero emission</text><rect x="248.8" y="583" width="166.0" height="29" rx="14.5" fill="#fff" stroke="#A9A59B" stroke-width="2.2"/><text x="259.8" y="603" font-size="18" fill="#22343A">not required, useful</text><text x="110" y="630" font-size="21" fill="#22343A"><tspan x="110" dy="0">Without the zone’s emissions: shows the most that local reductions can achieve. A</tspan><tspan x="110" dy="24.8">regional model is needed; ozone may increase.</tspan></text><circle cx="79" cy="677" r="19" fill="#1F5F63"/><text x="79" y="685" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">6</text><text x="110" y="684" font-size="24" fill="#1F5F63" font-weight="700">Selected measures</text><rect x="287.2" y="663" width="187.6" height="29" rx="14.5" fill="#1F5F63"/><text x="298.20000000000005" y="683" font-size="18" fill="#fff" font-weight="700">required, if data exist</text><text x="110" y="710" font-size="21" fill="#22343A"><tspan x="110" dy="0">The effect of each measure alone. For reactive pollutants measures interact, so they</tspan><tspan x="110" dy="24.8">are also assessed together, as a package.</tspan></text><circle cx="79" cy="757" r="19" fill="#1F5F63"/><text x="79" y="765" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">7</text><text x="110" y="764" font-size="24" fill="#1F5F63" font-weight="700">Average exposure (AEI)</text><rect x="335.2" y="743" width="360.4" height="29" rx="14.5" fill="#1F5F63"/><text x="346.20000000000005" y="763" font-size="18" fill="#fff" font-weight="700">required if the reduction obligation is not met</text><text x="110" y="790" font-size="21" fill="#22343A"><tspan x="110" dy="0">AEI = average exposure indicator: mean of 3 consecutive years compared with that of 10</tspan><tspan x="110" dy="24.8">years before the projection year.</tspan></text></g>
<path d="M864.0,516 h10 v-9 l16,18 l-16,18 v-9 h-10 z" fill="#1F5F63"/>
<g id="panel2"><rect x="896" y="170" width="500" height="710" rx="30" fill="#fff" stroke="#1F5F63" stroke-opacity=".35" stroke-width="2"/><circle cx="936" cy="218" r="24.0" fill="#1F5F63"/><text x="936" y="228.0" font-size="28" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="976.0" y="230.0" font-size="36" fill="#1F5F63" font-weight="700">What changes</text><text x="920" y="266" font-size="19" fill="#22343A" font-style="italic">invented example: concentration as % of the limit</text><path d="M1076.0,310 V606" stroke="#A9A59B" stroke-opacity=".5" stroke-width="1.6"/><text x="1076.0" y="634" font-size="20" fill="#22343A" text-anchor="middle">0</text><path d="M1172.7,310 V606" stroke="#A9A59B" stroke-opacity=".5" stroke-width="1.6"/><text x="1172.6666666666667" y="634" font-size="20" fill="#22343A" text-anchor="middle">50</text><path d="M1269.3,310 V606" stroke="#A9A59B" stroke-opacity=".5" stroke-width="1.6"/><text x="1269.3333333333333" y="634" font-size="20" fill="#22343A" text-anchor="middle">100</text><path d="M1366.0,310 V606" stroke="#A9A59B" stroke-opacity=".5" stroke-width="1.6"/><text x="1366.0" y="634" font-size="20" fill="#22343A" text-anchor="middle">150</text><text x="920" y="352.0" font-size="21" fill="#22343A">Reference</text><rect x="1076.0" y="330.0" width="261.0" height="30" rx="5" fill="#D7372B"/><text x="1086" y="352.0" font-size="20" fill="#fff" font-weight="700">135</text><text x="920" y="410.0" font-size="21" fill="#22343A">Baseline</text><rect x="1076.0" y="388.0" width="222.3" height="30" rx="5" fill="#D7372B"/><text x="1086" y="410.0" font-size="20" fill="#fff" font-weight="700">115</text><path d="M1277.1,403.0 H1323.5 M1277.1,394.0 v18 M1323.5,394.0 v18" stroke="#22343A" stroke-width="3.2" stroke-linecap="round" fill="none"/><text x="920" y="468.0" font-size="21" fill="#22343A">Selected measures</text><rect x="1076.0" y="446.0" width="170.1" height="30" rx="5" fill="#2A9D9A"/><text x="1086" y="468.0" font-size="20" fill="#fff" font-weight="700">88</text><path d="M1226.8,461.0 H1267.4 M1226.8,452.0 v18 M1267.4,452.0 v18" stroke="#22343A" stroke-width="3.2" stroke-linecap="round" fill="none"/><text x="920" y="526.0" font-size="21" fill="#22343A">Maximum reduction</text><rect x="1076.0" y="504.0" width="139.2" height="30" rx="5" fill="#2A9D9A"/><text x="1086" y="526.0" font-size="20" fill="#fff" font-weight="700">72</text><text x="920" y="584.0" font-size="21" fill="#22343A">Zero emission</text><rect x="1076.0" y="562.0" width="69.6" height="30" rx="5" fill="#2A9D9A"/><text x="1086" y="584.0" font-size="20" fill="#fff" font-weight="700">36</text><path d="M1269.3,302 V606" stroke="#22343A" stroke-width="3.4" stroke-dasharray="9 6"/><text x="1277.3333333333333" y="298" font-size="20" fill="#22343A" font-weight="700">limit</text><text x="1221.0" y="664" font-size="20" fill="#22343A" text-anchor="middle">concentration, % of the limit</text><path d="M922,688 h40 M922,680 v16 M962,680 v16" stroke="#22343A" stroke-width="3.2" stroke-linecap="round" fill="none"/><text x="974" y="694" font-size="20" fill="#22343A">range between best and worst case</text><text x="920" y="730" font-size="21" fill="#1F5F63" font-weight="700"><tspan x="920" dy="0">The distance between “Reference” and “Zero emission”</tspan><tspan x="920" dy="25.6">is the part that depends on the zone’s emissions.</tspan></text><text x="920" y="790" font-size="21" fill="#22343A"><tspan x="920" dy="0">The chosen scenario meets the limit even in the worst</tspan><tspan x="920" dy="25.6">case.</tspan></text></g>
<path d="M1404.0,516 h10 v-9 l16,18 l-16,18 v-9 h-10 z" fill="#1F5F63"/>
<g id="panel3"><rect x="1436" y="170" width="448" height="710" rx="30" fill="#fff" stroke="#1F5F63" stroke-opacity=".35" stroke-width="2"/><circle cx="1476" cy="218" r="24.0" fill="#1F5F63"/><text x="1476" y="228.0" font-size="28" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="1516.0" y="230.0" font-size="36" fill="#1F5F63" font-weight="700">Uncertainty and runs</text><text x="1460" y="270" font-size="25" fill="#1F5F63" font-weight="700">Best and worst case</text><text x="1460" y="310" font-size="21" fill="#22343A"><tspan x="1460" dy="0">The directive asks, where possible, for a best,</tspan><tspan x="1460" dy="25.6">a most likely and a worst case, obtained with</tspan><tspan x="1460" dy="25.6">sensitivity tests: the efficiency of</tspan><tspan x="1460" dy="25.6">technologies, implementation, take-up,</tspan><tspan x="1460" dy="25.6">exemptions and enforcement are varied.</tspan></text><text x="1460" y="466" font-size="25" fill="#1F5F63" font-weight="700">How many runs?</text><text x="1460" y="506" font-size="21" fill="#22343A"><tspan x="1460" dy="0">Calculating every measure and every case leads</tspan><tspan x="1460" dy="25.6">to too many scenarios. Two are often enough for</tspan><tspan x="1460" dy="25.6">the projection year: the baseline and the final</tspan><tspan x="1460" dy="25.6">scenario, which meets the limit. If the limit</tspan><tspan x="1460" dy="25.6">is not reached, more measures and scenarios are</tspan><tspan x="1460" dy="25.6">needed. If the AEI is needed, one more is added</tspan><tspan x="1460" dy="25.6">with the emissions of 10 years before the</tspan><tspan x="1460" dy="25.6">projection year.</tspan></text><rect x="1460.0" y="732" width="95.2" height="38" rx="10" fill="#1F5F63"/><text x="1507.6" y="758" font-size="21" fill="#fff" font-weight="700" text-anchor="middle">Baseline</text><rect x="1567.2" y="732" width="70.0" height="38" rx="10" fill="#1F5F63"/><text x="1602.2" y="758" font-size="21" fill="#fff" font-weight="700" text-anchor="middle">Final</text><rect x="1460.0" y="784" width="322.0" height="63" rx="10" fill="#fff" stroke="#1F5F63" stroke-width="2.6" stroke-dasharray="7 5"/><text x="1621.0" y="810" font-size="21" fill="#1F5F63" font-weight="700" text-anchor="middle"><tspan x="1621.0" dy="0">+ AEI: emissions of 10 years before</tspan><tspan x="1621.0" dy="24.1">the projection year (if needed)</tspan></text></g>
<g id="definition"><rect x="36" y="910" width="1848" height="120" rx="28" fill="#1F5F63"/><text x="74" y="960" font-size="27" fill="#fff"><tspan font-weight="700">Scenario:</tspan> a calculation with emissions changed from the reference year, with the same meteorology, to see how much the measures are needed and worth.</text><text x="74" y="1000" font-size="27" fill="#fff">The plan shows what happens with no new action (baseline) and with which measures the limit is met.</text></g>
</svg>
